<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>执业药师 · 中药 模拟考试系统</title>
<style>
/* ============================================================
   全局
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f4fa;
  --card: #ffffff;
  --line: #e4e9f2;
  --txt: #26303f;
  --sub: #7a8698;
  --pri: #2563eb;
  --pri-d: #1d4ed8;
  --pri-bg: #eaf1ff;
  --green: #16a34a;
  --red: #dc2626;
  --amber: #d97706;
  --purple: #7c3aed;
  --cyan: #0891b2;
  --radius: 14px;
  --shadow: 0 6px 24px rgba(30, 60, 120, .10);
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--txt);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* 通用卡片 / 按钮 */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 20px; border-radius: 10px; font-size: 15px; font-weight: 600;
  transition: transform .08s ease, box-shadow .15s ease, opacity .15s ease;
}
.btn:active { transform: scale(.97); }
.btn-pri { background: linear-gradient(135deg, var(--pri), var(--pri-d)); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.35); }
.btn-ghost { background: var(--pri-bg); color: var(--pri-d); }
.btn-line { background: #fff; color: var(--sub); border: 1px solid var(--line); }
.btn-danger { background: #fee2e2; color: var(--red); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ============================================================
   顶部导航
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #fff; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 10px rgba(20,40,80,.25);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .5px; }
.topbar .brand .logo {
  width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.topbar .top-actions { display: flex; gap: 8px; align-items: center; }
.topbar .tb-btn {
  background: rgba(255,255,255,.16); color: #fff; border-radius: 9px;
  padding: 7px 12px; font-size: 13px; font-weight: 600;
}
.topbar .tb-btn:hover { background: rgba(255,255,255,.26); }

/* ============================================================
   首页：题库选择
   ============================================================ */
.page { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
.home-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.home-head h2 { font-size: 20px; }
.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 5px 13px; font-size: 13px; color: var(--sub); }
.stat-pill b { color: var(--pri); font-size: 15px; }

.subject-block { margin-bottom: 22px; }
.subject-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; margin: 0 2px 10px;
}
.subject-title .dot { width: 10px; height: 10px; border-radius: 3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.bank-card {
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
  border: 1px solid var(--line); transition: transform .12s ease, box-shadow .2s ease, border-color .2s;
}
.bank-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--pri); }
.bank-card .bc-top { display: flex; justify-content: space-between; align-items: center; }
.bank-card .bc-name { font-weight: 700; font-size: 15px; }
.bank-card .bc-total { font-size: 12px; color: var(--sub); background: var(--bg); padding: 3px 9px; border-radius: 12px; }
.bank-card .bc-meta { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bank-card .bc-foot { display: flex; gap: 8px; margin-top: 2px; }
.bank-card .bc-foot .btn { flex: 1; padding: 8px 10px; font-size: 13px; }

/* 空态 */
.empty-tip { text-align: center; color: var(--sub); padding: 40px 16px; }

/* ============================================================
   设置页
   ============================================================ */
.setup-wrap { max-width: 520px; margin: 0 auto; }
.setup-card { padding: 22px; margin-bottom: 14px; }
.setup-card h3 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.setup-row { margin-bottom: 16px; }
.setup-row label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 7px; font-weight: 600; }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px 6px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--sub); }
.seg button.on { background: #fff; color: var(--pri); box-shadow: 0 2px 6px rgba(30,60,120,.12); }
.num-row { display: flex; gap: 10px; }
.num-box { flex: 1; }
.num-box input, .num-box select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  font-size: 15px; background: #fff; color: var(--txt); outline: none;
}
.num-box input:focus, .num-box select:focus { border-color: var(--pri); box-shadow: 0 0 0 3px var(--pri-bg); }
.switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; }
.switch-row .sw-label { font-size: 14px; }
.switch-row .sw-label small { display: block; color: var(--sub); font-size: 12px; }
.switch { position: relative; width: 46px; height: 26px; background: #d5dce8; border-radius: 26px; transition: background .2s; flex: none; }
.switch::after { content:''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch.on { background: var(--pri); }
.switch.on::after { left: 23px; }
.summary {
  background: var(--pri-bg); border-radius: 12px; padding: 14px 16px;
  font-size: 14px; color: var(--pri-d); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.start-btn { width: 100%; padding: 14px; font-size: 16px; margin-top: 4px; }

/* ============================================================
   考试页
   ============================================================ */
.exam-head {
  position: sticky; top: 0; z-index: 20;
  background: #fff; border-bottom: 1px solid var(--line);
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
}
.exam-head .eh-info { flex: 1; min-width: 0; }
.exam-head .eh-subj { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exam-head .eh-label { font-size: 12px; color: var(--sub); }
.timer {
  background: #111827; color: #fff; font-variant-numeric: tabular-nums;
  border-radius: 10px; padding: 7px 12px; font-size: 17px; font-weight: 700; letter-spacing: 1px;
}
.timer.warn { background: var(--red); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .6; } }

.exam-layout { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr 250px; gap: 14px; padding: 14px 16px 80px; }
.question-area { min-width: 0; }

/* 答题卡 */
.answer-card { position: sticky; top: 76px; align-self: start; padding: 14px; }
.answer-card .ac-stats { display: flex; gap: 6px; margin-bottom: 12px; }
.answer-card .ac-stats .st { flex: 1; background: var(--bg); border-radius: 9px; padding: 7px 4px; text-align: center; }
.answer-card .ac-stats .st b { display: block; font-size: 17px; }
.answer-card .ac-stats .st span { font-size: 11px; color: var(--sub); }
.answer-card .st.done b { color: var(--green); }
.answer-card .st.none b { color: var(--amber); }
.answer-card .st.flag b { color: var(--purple); }
.answer-card .ac-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.answer-card .ac-grid button {
  aspect-ratio: 1/1; border-radius: 9px; background: #f4f6fb; color: var(--txt);
  font-size: 13px; font-weight: 700; border: 1px solid var(--line);
}
.answer-card .ac-grid button.done { background: var(--green); color: #fff; border-color: var(--green); }
.answer-card .ac-grid button.flag { box-shadow: inset 0 0 0 2px var(--purple); }
.answer-card .ac-grid button.cur { outline: 2px solid var(--pri); outline-offset: 1px; }
.answer-card .ac-legend { margin-top: 12px; font-size: 12px; color: var(--sub); display: flex; gap: 10px; flex-wrap: wrap; }
.answer-card .ac-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.submit-btn { width: 100%; margin-top: 12px; }

/* 题目卡片 */
.qcard { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
.q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.type-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 14px; color: #fff; }
.tb-A { background: var(--pri); }
.tb-B { background: var(--green); }
.tb-C { background: var(--amber); }
.tb-X { background: var(--purple); }
.q-num { font-size: 13px; color: var(--sub); font-weight: 600; }
.q-pos { margin-left: auto; font-size: 12px; color: var(--sub); }

.group-box {
  background: var(--pri-bg); border-left: 4px solid var(--pri); border-radius: 8px;
  padding: 12px 14px; margin: 0 0 14px; font-size: 14px;
}
.group-box .gb-tag { display: block; font-size: 12px; color: var(--pri-d); font-weight: 700; margin-bottom: 4px; }
.stem { font-size: 16px; font-weight: 600; margin-bottom: 16px; white-space: pre-wrap; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px;
  border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px;
  cursor: pointer; transition: border-color .12s, background .12s; font-size: 15px;
}
.opt:hover { border-color: var(--pri); }
.opt .ol {
  width: 26px; height: 26px; flex: none; border-radius: 8px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--sub);
}
.opt .ot { flex: 1; line-height: 1.55; }
.opt.sel { border-color: var(--pri); background: var(--pri-bg); }
.opt.sel .ol { background: var(--pri); color: #fff; }
.opt.sel .ol::before { content: '✓'; }
.opt[data-type="X"] .ol { border-radius: 50%; }

.q-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.q-foot .btn { padding: 8px 14px; font-size: 13px; }
.flag-btn { margin-left: auto; }
.flag-btn.on { background: var(--purple); color: #fff; }

/* 解析 */
.explain {
  background: #f6f8fb; border-radius: 10px; padding: 14px 16px; margin-top: 16px;
  font-size: 14px; line-height: 1.7; border: 1px solid var(--line);
}
.explain .ex-ans { font-weight: 700; margin-bottom: 6px; }
.explain .ex-ans.right { color: var(--green); }
.explain .ex-ans.wrong { color: var(--red); }

/* ============================================================
   结果页
   ============================================================ */
.result-hero { text-align: center; padding: 30px 20px; margin-bottom: 16px; }
.score-ring {
  width: 150px; height: 150px; margin: 0 auto 14px; position: relative;
  background: conic-gradient(var(--pri) calc(var(--p)*1%), #e8edf5 0);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.score-ring::before { content:''; position: absolute; inset: 12px; background: #fff; border-radius: 50%; }
.score-ring .sr-in { position: relative; z-index: 1; text-align: center; }
.score-ring .sr-score { font-size: 40px; font-weight: 800; color: var(--pri); line-height: 1; }
.score-ring .sr-max { font-size: 13px; color: var(--sub); margin-top: 4px; }
.verdict { font-size: 18px; font-weight: 800; }
.verdict.pass { color: var(--green); }
.verdict.fail { color: var(--red); }
.result-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.result-stats .rs { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 6px; text-align: center; }
.result-stats .rs b { display: block; font-size: 20px; }
.result-stats .rs span { font-size: 12px; color: var(--sub); }
.result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }

.review { margin-top: 8px; }
.review-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.review-head h3 { font-size: 17px; }
.filter-btns { display: flex; gap: 6px; }
.filter-btns button { padding: 6px 12px; border-radius: 16px; font-size: 13px; background: #fff; border: 1px solid var(--line); color: var(--sub); }
.filter-btns button.on { background: var(--pri); border-color: var(--pri); color: #fff; }

/* ============================================================
   错题本
   ============================================================ */
.wrong-item { padding: 16px; margin-bottom: 12px; }
.wrong-item .wi-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.wrong-item .wi-stem { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.wrong-item .wi-meta { font-size: 12px; color: var(--sub); display: flex; gap: 12px; flex-wrap: wrap; }
.wrong-item .wi-actions { margin-top: 12px; display: flex; gap: 8px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--sub); font-weight: 600; }

/* 底部浮层（考试页操作按钮） */
.exam-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: #fff; border-top: 1px solid var(--line);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 10px; max-width: 1080px; margin: 0 auto;
}
.exam-nav .btn { flex: 1; }

/* 移动端适配 */
@media (max-width: 860px) {
  .exam-layout { grid-template-columns: 1fr; padding-bottom: 90px; }
  .answer-card { position: static; }
  .answer-card .ac-grid { grid-template-columns: repeat(8, 1fr); }
  .result-stats { grid-template-columns: repeat(2, 1fr); }
  .page { padding: 14px 12px 40px; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="brand">
    <span class="logo">📘</span>
    <span>执业药师 · 中药模拟考试</span>
  </div>
  <div class="top-actions">
    <button class="tb-btn" id="navWrong" onclick="goWrongbook()">错题本 <span id="wrongCount" style="opacity:.85"></span></button>
    <button class="tb-btn" id="navHome" onclick="goHome()" style="display:none">题库</button>
  </div>
</header>

<!-- ===================== 首页：题库选择 ===================== -->
<div id="page-home" class="page">
  <div class="home-head">
    <h2>选择题库开始练习</h2>
    <div class="stat-pills">
      <span class="stat-pill">累计做题 <b id="stDone"></b></span>
      <span class="stat-pill">正确率 <b id="stRate"></b></span>
    </div>
  </div>
  <div id="subjectList"></div>
  <div class="empty-tip hidden" id="emptyTip">暂无可用的题库数据。</div>
</div>

<!-- ===================== 设置页 ===================== -->
<div id="page-setup" class="page setup-wrap hidden">
  <div class="setup-card card">
    <h3>📋 考试设置</h3>
    <div class="setup-row">
      <label>当前题库</label>
      <div class="summary" id="sumBank"></div>
    </div>
    <div class="setup-row">
      <label>题目范围</label>
      <div class="seg" id="segRange">
        <button data-range="all" class="on" onclick="setRange('all')">整卷（全部题）</button>
        <button data-range="random" onclick="setRange('random')">随机抽题</button>
      </div>
    </div>
    <div class="setup-row hidden" id="rowCount">
      <label>抽取题数</label>
      <div class="num-box"><input type="number" id="setCount" value="60" min="5" max="200"></div>
    </div>
    <div class="setup-row">
      <div class="num-row">
        <div class="num-box">
          <label>考试时长（分钟）</label>
          <input type="number" id="setTime" value="90" min="5" max="300">
        </div>
        <div class="num-box">
          <label>及格分数</label>
          <input type="number" id="setPass" value="60" min="1">
        </div>
      </div>
    </div>
    <div class="switch-row">
      <div class="sw-label">随机打乱题目顺序<small>打乱后题目顺序不固定</small></div>
      <div class="switch on" id="swShuffle" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="switch-row">
      <div class="sw-label">随机打乱选项顺序<small>打乱后选项字母会重新分配</small></div>
      <div class="switch" id="swShuffleOpt" onclick="toggleSwitch(this)"></div>
    </div>
    <div class="switch-row">
      <div class="sw-label">交卷后即时显示解析<small>关闭则只显示对错，可手动展开</small></div>
      <div class="switch on" id="swShowExp" onclick="toggleSwitch(this)"></div>
    </div>
  </div>
  <button class="btn btn-pri start-btn" onclick="startExam()">🚀 开始考试</button>
</div>

<!-- ===================== 考试页 ===================== -->
<div id="page-exam" class="hidden">
  <div class="exam-head">
    <div class="eh-info">
      <div class="eh-subj" id="exSubj"></div>
      <div class="eh-label" id="exLabel"></div>
    </div>
    <div class="timer" id="timer">90:00</div>
    <button class="btn btn-danger" style="padding:8px 14px" onclick="confirmSubmit()">交卷</button>
  </div>

  <div class="exam-layout">
    <div class="question-area" id="qArea"></div>

    <aside class="answer-card card">
      <div class="ac-stats">
        <div class="st done"><b id="stDoneN">0</b><span>已答</span></div>
        <div class="st none"><b id="stNoneN">0</b><span>未答</span></div>
        <div class="st flag"><b id="stFlagN">0</b><span>标记</span></div>
      </div>
      <div class="ac-grid" id="navGrid"></div>
      <div class="ac-legend">
        <span><i style="background:var(--green)"></i>已答</span>
        <span><i style="background:#f4f6fb;border:1px solid var(--line)"></i>未答</span>
        <span><i style="background:var(--purple)"></i>标记</span>
      </div>
      <button class="btn btn-pri submit-btn" onclick="confirmSubmit()">交卷并评分</button>
    </aside>
  </div>

  <div class="exam-nav">
    <button class="btn btn-line" onclick="goPrev()">◀ 上一题</button>
    <button class="btn btn-pri" onclick="goNext()">下一题 ▶</button>
  </div>
</div>

<!-- ===================== 结果页 ===================== -->
<div id="page-result" class="page hidden">
  <div class="card result-hero">
    <div class="score-ring" id="ring">
      <div class="sr-in">
        <div class="sr-score" id="resScore">0</div>
        <div class="sr-max" id="resMax">/ 0 题</div>
      </div>
    </div>
    <div class="verdict" id="resVerdict"></div>
    <div style="color:var(--sub);font-size:13px;margin-top:6px" id="resMeta"></div>
  </div>

  <div class="result-stats">
    <div class="rs"><b id="rsTotal" style="color:var(--pri)">0</b><span>总题数</span></div>
    <div class="rs"><b id="rsCorrect" style="color:var(--green)">0</b><span>答对</span></div>
    <div class="rs"><b id="rsWrong" style="color:var(--red)">0</b><span>答错</span></div>
    <div class="rs"><b id="rsRate" style="color:var(--amber)">0%</b><span>正确率</span></div>
  </div>

  <div class="result-actions">
    <button class="btn btn-pri" onclick="retry()">🔁 再考一次</button>
    <button class="btn btn-ghost" onclick="goHome()">🏠 返回题库</button>
    <button class="btn btn-line" onclick="window.print()">🖨 打印</button>
  </div>

  <div class="review">
    <div class="review-head">
      <h3>答案解析</h3>
      <div class="filter-btns">
        <button class="on" data-f="all" onclick="setReviewFilter('all',this)">全部</button>
        <button data-f="wrong" onclick="setReviewFilter('wrong',this)">只看错题</button>
        <button data-f="right" onclick="setReviewFilter('right',this)">只看答对</button>
      </div>
    </div>
    <div id="reviewList"></div>
  </div>
</div>

<!-- ===================== 错题本 ===================== -->
<div id="page-wrong" class="page hidden">
  <div class="home-head">
    <h2>📕 我的错题本</h2>
    <button class="btn btn-danger" style="padding:7px 14px;font-size:13px" onclick="clearWrongbook()">清空错题</button>
  </div>
  <div id="wrongList"></div>

与外用散剂","含低共熔成分散剂与含液体成分散剂"],"answer":"D","explanation":"散剂按医疗用途分类可分为内服散剂、外用散剂；按药物组成分类 可分为单味药散剂、复方散剂；按药物性质分类可分为普通散剂、特殊散剂；按给药要求分 类可分为分剂量散剂、非剂量散剂。","chapter":"","groupId":null},{"type":"A","num":10,"stem":"关于蜂蜜炼制的说法，错误的是","groupStem":null,"options":["通过炼制可除去杂质、杀灭微生物、降低水分含量","中蜜能“滴水成珠”","嫩蜜的含水量为17%-20%","炼制至老蜜时，表面会出现“牛眼泡”","老蜜黏性强，会“打白丝”"],"answer":"B","explanation":"老蜜炼制时表面出现“牛眼泡”，能“滴水成珠”（滴入冷水呈球形而 不散），故B错误。","chapter":"","groupId":null},{"type":"A","num":11,"stem":"切制前对药材水处理过程中，要检查其软化程度，宜用手捏法检查的药材是","groupStem":null,"options":["木香","延胡索","大黄","木通","白术"],"answer":"B","explanation":"手捏法适于不规则的根及根茎类，如当归、独活、黄芩、延胡索、 枳实、雷丸。木香、木通采用弯曲法检查；大黄采用穿刺法检查；白术采用刀切或折断法检 查。","chapter":"","groupId":null},{"type":"A","num":12,"stem":"大鼠灌胃给药后，血药浓度-时间曲线出现双峰，代谢产物之一与原药的结构中均含葡萄 糖醛酸的是","groupStem":null,"options":["橙皮苷","大豆苷","金丝桃苷","木犀草苷","黄芩苷"],"answer":"E","explanation":"黄芩苷大鼠灌胃给药后，血药浓度-时间曲线出现双峰，代谢产物 之一与原药的结构中均含葡萄糖醛酸。","chapter":"","groupId":null},{"type":"A","num":13,"stem":"关于凝胶剂质量要求的说法，错误的是","groupStem":null,"options":["混悬型凝胶剂中胶粒应分散均匀，不应下沉、结块","用于烧伤治疗的凝胶剂必须为无菌制剂","凝胶剂应均匀细腻，在常温时保持胶状","凝胶剂一般应检查pH值","凝胶剂可根据需要添加抑菌剂"],"answer":"B","explanation":"用于烧伤治疗的凝胶剂可以是无菌制剂，也可是非无菌制剂。","chapter":"","groupId":null},{"type":"A","num":14,"stem":"主根呈长圆锥形，叶基生；花茎纤细，龙瓣5，花距细管状；蒴果椭圆形或3裂，种子淡 棕色的药材是","groupStem":null,"options":["金钱草","紫花地丁","蒲公英","车前草","白花蛇舌草"],"answer":"B","explanation":"紫花地丁有蒴果，蒴果椭圆形或3裂；主根呈长圆锥形，叶基生； 花茎纤细，龙瓣5，花距细管状。注意习题容易错选白花蛇舌草，白花蛇舌草蒴果扁球形， 顶端具4枚宿存的萼齿。","chapter":"","groupId":null},{"type":"A","num":15,"stem":"根头略膨大，可见暗绿色或暗棕色轮状排列的叶柄残基和密集状突起的药材是","groupStem":null,"options":["党参","银柴胡","防风","板蓝根","桔梗"],"answer":"D","explanation":"板蓝根根头略膨大，可见暗绿色或暗棕色轮状排列的叶柄残基和密 集状突起。","chapter":"","groupId":null},{"type":"A","num":16,"stem":"糖浆剂中的山梨酸抑制霉菌和酵母菌效果最好的pH范围是","groupStem":null,"options":["3.0-3.5","3.4-3.8","4.0-4.5","5.0-5.5","4.4-4.8"],"answer":"E","explanation":"在含糖40%-80%（g/ml）的糖浆剂中用枸橼酸调节pH为3.0-3.5 时，苯甲酸对霉菌和酵母菌的抑制作用较强，而山梨酸的最适pH为4.4-4.8。","chapter":"","groupId":null},{"type":"A","num":17,"stem":"呈结节状扁圆柱形，略弯曲；表面黄棕 单萜 类化合物，熊果酸属于三萜类化合物。","chapter":"","groupId":null},{"type":"X","num":116,"stem":"关于牛黄性状鉴别特征的说法，正确的有{多选}","groupStem":null,"options":["呈卵形、类球形、三角形或四方形，大小不一","体重，质地坚实，不易破碎","香气浓烈而特异，味微辣、微苦带咸","表面黄红色至棕黄色，有的具龟裂纹","断面金黄色，可见同心层纹"],"answer":"ADE","explanation":"牛黄体轻，质酥脆，易分层剥落，B错误；牛黄气清香，味先苦 而后微甘，有清凉感，嚼之易碎，不粘牙，C错误。其余选项说法正确。","chapter":"","groupId":null},{"type":"X","num":117,"stem":"表面活性剂在制剂中可用作{多选}","groupStem":null,"options":["增溶剂","乳化剂","润湿剂","起泡剂","消泡剂"],"answer":"ABCDE","explanation":"表面活性剂在制剂中可用作增溶剂、乳化剂、润湿剂、起泡 剂和消泡剂、去污剂、消毒剂及杀菌剂。","chapter":"","groupId":null},{"type":"X","num":118,"stem":"药用部位为干燥种子的药材有{多选}","groupStem":null,"options":["牵牛子","地肤子","葶苈子","蛇床子","沙苑子"],"answer":"ACE","explanation":"根据金句三人牵马停沙滩，决定明天吃狼兔，牵牛子、葶苈子、 沙苑子都是属于种子入药。地肤子、蛇床子属于果实入药。","chapter":"","groupId":null},{"type":"X","num":119,"stem":"关于栀子炮制方法和作用的说法，正确的有{多选}","groupStem":null,"options":["栀子炒后京尼平苷含量有所上升","炒栀子比焦栀子苦寒之性略强","炒栀子可缓和对胃的刺激性","炒栀子有清热除烦的功效","栀子长于泻火利湿、凉血解毒"],"answer":"BCDE","explanation":"栀子炒后京尼平苷含量有所下降，A错误，其余选项说法正确。","chapter":"","groupId":null},{"type":"X","num":120,"stem":"在含苞待放时采收的花类药材有{多选}","groupStem":null,"options":["辛夷","丁香","洋金花","款冬花","西红花"],"answer":"ABD","explanation":"辛夷、丁香、款冬花都是花蕾入药，在花含苞待放时采收。洋金 花在花初开时采收，西红花在花盛开时采收。","chapter":"","groupId":null}]},{"id":"2023中药二","subject":"中药二","year":"2023","label":"2023年中药二真题","total":120,"questions":[{"type":"A","num":1,"stem":"两药均既能治感冒，又能治肝气郁滞证的是（）。","groupStem":null,"options":["金银花、连翘","薄荷、柴胡","桑叶、菊花","大青叶、薄荷","柴胡、蝉蜕"],"answer":"B","explanation":"薄荷【功效】宣散风热，清利头目，利咽，透疹，疏肝。柴胡【功 效】解表退热，疏肝解郁，升举阳气。两者均能疏肝，治肝气郁结","chapter":"","groupId":null},{"type":"A","num":2,"stem":"某男，24岁。感冒5日，症见咽喉肿痛、咳喘、痰多、喉中如水鸡声，舌红、苔黄腻。证 属热结痰瘀，宜选用的药是（）。","groupStem":null,"options":["青黛","白头翁","射干","鱼腥草","石膏"],"answer":"C","explanation":"射干【功效】清热解毒，祛痰利咽，散结消肿。【主治病证】（1） 咽喉肿痛（证属热结痰瘀者尤宜）。（2）痰多咳喘。（3）久疟疟母，闭经，痈肿，瘰疬、癥 瘕。","chapter":"","groupId":null},{"type":"A","num":3,"stem":"大黄泻热通便力强，素有“将军”之号。关于大黄用法与使用注意的说法，错误的是","groupStem":null,"options":["泻下宜生用","哺乳期妇女应慎服","酒大黄多用于上部火热证","制大黄多用于血热出血证","阴虚者不可妄用"],"answer":"D","explanation":"大黄【用法用量】内服：煎汤，一般用5~10g，热结重症用15~20g， 散剂减半。外用：适量，研末敷。生大黄泻下作用强，欲攻下者宜生用，入汤剂应后下，久 煎则泻下力减弱；亦可用开水泡服，或研末吞服。酒大黄，取酒上行之性，多用于上部火热 之证。制大黄，泻下力减弱，活血作用较好，多用于瘀血证或不宜峻下者。大黄炭则凉血化 瘀止血。【使用注意】本品苦寒，善攻下泻热、活血逐瘀，故妇女妊娠期、月经期、哺乳期 应慎服或忌服。又易伤胃气与气血，故脾胃虚寒、气血亏虚、无瘀血、无积滞、阴疽或痈肿 溃后脓清者不可妄用。","chapter":"","groupId":null},{"type":"A","num":4,"stem":"既能祛风通络，又能凉血消肿的药是（）。","groupStem":null,"options":["海风藤","徐长卿","青风藤","络石藤","伸筋草"],"answer":"D","explanation":"络石藤【功效】祛风通络，又能凉血消肿。","chapter":"","groupId":null},{"type":"A","num":5,"stem":"某男，35岁。食欲不振5日，症见口中甜腻，舌质淡红、苔薄黄而腻。证属湿热阻滞中焦， 宜选用的药是（）。","groupStem":null,"options":["草豆蔻","佩兰","广藿香","肉豆蔻","白豆蔻"],"answer":"B","explanation":"佩兰功效：化湿，解暑。主治：（1）湿阻中焦证。（2）湿热困脾。 （3）暑湿及湿温初起。","chapter":"","groupId":null},{"type":"A","num":6,"stem":"具有清热排脓、除痹功效的药是（）。","groupStem":null,"options":["白芷","天花粉","薏苡仁","土茯苓","白鲜皮"],"answer":"C","explanation":"薏苡仁【功效】利水渗湿，健脾止泻，除痹，清热排脓。【主治病 证】（1）小便不利、水肿、脚气肿痛。（2）脾虚泄泻。（3）湿温病邪在气分。（4）湿痹筋脉 拘挛。（5）肺痈，肠痈。","chapter":"","groupId":null},{"type":"A","num":7,"stem":"肉桂的功效不包括（）。","groupStem":null,"options":["补火助阳","引火归元","温通经脉","散寒止痛","温肺化饮"],"answer":"E","explanation":"肉桂【功效】补火助阳，引火归元，散寒止痛，温通经脉。","chapter":"","groupId":null},{"type":"A","num":8,"stem":"生用专行气滞，煨熟用实肠止泻的药是（）。","groupStem":null,"options":["木香","葛根","白术","薤白","砂仁"],"answer":"A","explanation":"木香【用法用量】内服：煎汤，3~6g；或入丸散。生用专行气滞， 煨熟用实肠止泻。","chapter":"","groupId":null},{"type":"A","num":9,"stem":"某男，5岁。素患遗尿，近日又见饮食积滞。宜选用的成药是（）。","groupStem":null,"options":["山楂","莱菔子","鸡内金","刘寄奴","青皮"],"answer":"C","explanation":"鸡内金【功效】运脾消食，固精止遗，化坚消石。【主治病证】（1） 食积不化，消化不良，小儿疳积。（2）遗尿，遗精。（3）泌尿系或肝胆结石症。","chapter":"","groupId":null},{"type":"A","num":10,"stem":"不入煎剂的是（）。","groupStem":null,"options":["槟榔","使君子","川楝子","鹤草芽","榧子"],"answer":"D","explanation":"鹤草芽【用法用量】内服：研粉吞服，成人每次30~50g。小儿按 体重0.7~0.8g/kg，每日1次，早晨空腹服。","chapter":"","groupId":null},{"type":"A","num":11,"stem":"某女，36岁。症见月经淋沥不净、少腹轻度刺痛、有血块。证属瘀血阻滞，血不归经， 宜选用的药是（）。","groupStem":null,"options":["仙鹤草","鸡冠花","月季花","茜草","棕榈炭"],"answer":"D","explanation":"茜草【功效】凉血，祛瘀，止血，通经。【主治病证】（1）吐血， 衄血，崩漏，尿血，便血等。（2）闭经，痛经，跌打肿痛，痹证关节痛。","chapter":"","groupId":null},{"type":"A","num":12,"stem":"善治血热出血、妇女倒经的药是（）。","groupStem":null,"options":["郁金","牛膝","虎杖","大蓟","地榆"],"answer":"A","explanation":"郁金【功效】活血止痛，行气解郁，凉血清心，利胆退黄。【主治 病证】（1）胸腹胁肋胀痛或刺痛，月经不调，痛经，癥瘕痞块。（2）热病神昏，癫痫发狂。 （3）血热吐血、衄血、尿血，妇女倒经。（4）湿热黄疸，肝胆或泌尿系结石症。","chapter":"","groupId":null},{"type":"A","num":13,"stem":"治疗痞块、顽痰久咳宜选用（）。","groupStem":null,"options":["礞石","海蛤壳","黄药子","海浮石","瓦楞子"],"answer":"E","explanation":"瓦楞子功效：消痰化瘀，软坚散结，制酸止痛。主治：（1）顽痰久 咳，瘰疬，瘿瘤。（2）癥瘕痞块。（3）胃痛泛酸。","chapter":"","groupId":null},{"type":"A","num":14,"stem":"朱砂入丸散的用量是（）。","groupStem":null,"options":["0.002~0.004","0.03~0.05g","0.6~0.9g","0.1~0.5g","1~3g"],"answer":"D","explanation":"朱砂【用法用量】内服：研末冲，或入丸散，0.1~0.5g；不入煎剂。 外用：适量，干掺，或调敷，或喷喉。","chapter":"","groupId":null},{"type":"A","num":15,"stem":"某女，58岁。近1月来时觉头晕目眩，2日前又见目赤、风疹痒。宜选用 的药是（）。","groupStem":null,"options":["珍珠母","防风","决明子","蒺藜","石决明"],"answer":"D","explanation":"蒺藜【功效】平肝，疏肝，祛风明目，散风止痒。【主治病证】（1） 肝阳上亢之头晕目眩。（2）肝气郁结之胸胁不舒、乳闭不通。（3）风热之目赤翳障。（4）风 疹瘙痒。","chapter":"","groupId":null},{"type":"A","num":16,"stem":"苏合香除能止痛外，又能（）。","groupStem":null,"options":["清热解毒","化湿和胃","开窍辟秽","行气活血","开窍宁神"],"answer":"C","explanation":"苏合香【功效】开窍辟秽，止痛。","chapter":"","groupId":null},{"type":"A","num":17,"stem":"某女，47岁。素患气阴两虚之消渴，又见肾虚之尿频、带下。宜选用的药是（）。","groupStem":null,"options":["西洋参","山药","黄精","哈蟆油","枸杞子"],"answer":"B","explanation":"山药【功效】益气养阴，补脾肺肾，固精止带。【主治病证】（1）脾 虚气弱之食少便溏或泄泻。（2）肺虚或肺肾两虚之喘咳。（3）肾阴虚证，消渴证。（4）肾虚 遗精、尿频、带下。","chapter":"","groupId":null},{"type":"A","num":18,"stem":"某女，33岁，患湿热带下，又见疮癣作痒。治当清热燥湿止带，宜选用的药是（）。","groupStem":null,"options":["赤石脂","椿皮","芡实","莲子肉","海螵蛸"],"answer":"B","explanation":"椿皮【功效】清热燥湿，涩肠，止血，止带，杀虫。【主治病证】 （1）久泻久痢，湿热泻痢，便血。（2）崩漏，赤白带下。（3）蛔虫病。（4）疮癣作痒。","chapter":"","groupId":null},{"type":"A","num":19,"stem":"既能治胸中痰饮，又能治疟疾的药是（）。","groupStem":null,"options":["藜芦","草果","雄黄","瓜蒂","常山"],"answer":"E","explanation":"常山功效：涌吐痰饮，截疟。主治：（1）胸中痰饮。（2）疟疾。","chapter":"","groupId":null},{"type":"A","num":20,"stem":"蛇床子除能燥湿祛风、杀虫止痒外，又能（）。","groupStem":null,"options":["补火通便","敛疮生肌","固精缩尿","止血止泻","温肾壮阳"],"answer":"E","explanation":"蛇床子【功效】燥湿祛风，杀虫止痒，温肾壮阳。【主治病证】（1） 阴部湿痒，湿疹，湿疮，疥癣。（2）寒湿带下，湿痹腰痛。（3）肾虚阳痿，宫冷不孕。","chapter":"","groupId":null},{"type":"A","num":21,"stem":"某女，26岁。症见头痛发热、恶寒身痛、鼻流清涕、咳嗽咽干。证属风寒感冒，治当疏 风散寒、解表清热，宜选用的成药是（）。","groupStem":null,"options":["感冒清热颗粒","表实感冒颗粒","荆防颗粒","桂枝合剂","双黄连合剂"],"answer":"A","explanation":"感冒清热颗粒【功能】疏风散寒，解表清热。【主治】风寒感冒， 头痛发热，恶寒身痛，鼻流清涕，咳嗽咽干。","chapter":"","groupId":null},{"type":"A","num":22,"stem":"关于防风通圣丸配伍意义的说法，错误的是（）。","groupStem":null,"options":["通利二便分消里热","行气活血同行","发汗而不伤正","清下而不伤里","汗下清利共施"],"answer":"B","explanation":"防风通圣丸【方义简释】麻黄辛散温通，微苦略降，善发汗解表、 宣散肺气；荆芥穗辛香微温发散，善散风解表、止痒；防风辛散微温发散，甘缓不峻，善祛 风解表胜湿；薄荷辛香疏散，凉能清解，善疏风解表、清利头目与咽喉。四药合用，既能使 外邪从汗而解，又能散风止痒，故为君药。大黄苦寒沉降，清泄通利，善泻下攻积、泻火解 毒；芒硝苦寒沉降，咸能软润，善泻热通便；滑石甘寒滑利清解，善利水渗湿、清解暑热； 栀子苦寒清利，屈曲下降，善清热泻火利湿。四药合用，既清热泻火，使里热从内而解，又 通利二便，使里热从二便分消。石膏辛甘大寒，清泄透解，善清热泻火；黄芩苦寒清泄而燥， 善清热燥湿、泻火解毒；连翘苦能泄散，微寒能清，质清上浮，善清热解毒、疏散风热，兼 散结利尿；桔梗辛散苦泄，质轻上浮，性平不偏，善开宣肺气、利咽。四药合用，善清热泻 火、解毒散结，兼助君药透散表邪。凡此八药，共为臣药。当归甘温补润，辛温行散，善补 血活血；白芍甘补酸敛，苦微寒清泄，善养血敛阴，兼能散血；川芎辛温行散温通，能活血 行气、祛风止痛；炒白术甘补渗利，苦温而燥，善健脾燥湿利湿。四药合用，既养血活血、 健脾和中，又祛风除湿。与君臣药同用，则发汗而不伤正，清下而不伤里，从而达到疏风解 表、泻热通便之效，故共为佐药。甘草甘补和缓，平而偏凉，伍桔梗能清热解毒利咽，并调 和诸药，故为使药。全方配伍，汗下与清利共施，共奏解表清里，清热解毒之功。","chapter":"","groupId":null},{"type":"A","num":23,"stem":"西黄丸中佐药是（）。","groupStem":null,"options":["麝香","牛黄","雄黄","乳香","没药"],"answer":"A","explanation":"西黄丸【方义简释】方中牛黄苦凉清泄，芳香开化，善泻火解毒、 清热化痰，故为君药。醋制乳香辛香走窜，苦泄温通，善活血止痛、消肿生肌；醋制没药苦 能泄散，芳香走窜，性平不偏，善破血止痛、消肿生肌。二药相须为用，药力更强，善”破癥 结宿血“，故为臣药。麝香辛散温通，芳香走窜，既行血分之滞而活血通经，又散结消肿止 痛，以助君臣药之力，故为佐药。","chapter":"","groupId":null},{"type":"A","num":24,"stem":"通宣理肺丸的功能是（）。","groupStem":null,"options":["解表散寒，宣肺止咳","宣肺散寒，止咳祛痰","清肺润燥，化痰止咳","清热化痰，宣肺止咳","辛凉宣泄，清肺平喘"],"answer":"A","explanation":"通宣理肺丸【功能】解表散寒，宣肺止咳。","chapter":"","groupId":null},{"type":"A","num":25,"stem":"某男，50岁。正值初秋，感冒1周，现症见咳嗽、痰黄而黏不易咳出、胸闷气促、久咳 不止、声哑喉痛。证属燥热蕴肺，宜选用的成药是","groupStem":null,"options":["橘红丸","川贝止咳露","养阴清肺膏","二母宁 "options":["党参","白术","天冬","山药片","天麻"],"answer":"D","explanation":"《中国药典》规定，山药片的二氧化硫量残留不得过 10mg/kg。","chapter":"","groupId":null},{"type":"A","num":16,"stem":"产地加工时要置沸水中略烫的药材是","groupStem":null,"options":["红参","黄芪","太子参","白芍","木香"],"answer":"C","explanation":"太子参加工时要置沸水中略烫。","chapter":"","groupId":null},{"type":"A","num":17,"stem":"药用部位为块根入药的是","groupStem":null,"options":["百部","天南星","虎杖","狗脊","商陆"],"answer":"A","explanation":"百部为块根入药，天南星为块茎入药，虎杖为根及根茎入药，狗脊为 根茎入药，商陆为根入药。","chapter":"","groupId":null},{"type":"A","num":18,"stem":"为我国历史上第一部药典性本草，也被誉为世界上第一部药典的是","groupStem":null,"options":["《本草纲目》","《神农本草经》","《新修本草》","《证类本草》","《本草经集注》"],"answer":"C","explanation":"《新修本草》是我国历史上第一部官修的药典性本草，也被誉为世界 上第一部药典。","chapter":"","groupId":null},{"type":"A","num":19,"stem":"五味是对人体不同效用的概括，效用为能泄，能坚，能燥的药味是","groupStem":null,"options":["酸","苦","甘","辛","咸"],"answer":"B","explanation":"苦能泄、能坚、能燥；酸能收、能涩；甘能补、能缓、能和；辛能散、 能行；咸能软、能下。","chapter":"","groupId":null},{"type":"A","num":20,"stem":"关于煎膏剂质量要求和临床应用注意事项的说法，错误的是","groupStem":null,"options":["加入炼蜜成炼糖的量一般不超过清膏量的 3 倍","因制备不当，贮有时易出现“返砂”","成品中需要添加防腐剂","应密封，贮存于阴凉处","不溶物检查，不得有焦屑等异物"],"answer":"C","explanation":"煎膏剂由于含糖较高，高糖引起的渗透压大，微生物难以生长，因此 成品中不需要添加防腐剂。","chapter":"","groupId":null},{"type":"A","num":21,"stem":"中药在切制时通常需要进行水处理软化、适宜的软化方法有利于保证饮片质 量。采用淋法软化的药材是","groupStem":null,"options":["肉苁蓉","川乌","昆布","荆芥","海藻"],"answer":"D","explanation":"荆芥主要含有挥发油类成分，有效成分易随水流失，采用淋法软化。 肉苁蓉、川乌、昆布、海藻采用漂法软化。","chapter":"","groupId":null},{"type":"A","num":22,"stem":"炉甘石洗剂处方：炉甘石 150g，氧化锌 50g，甘油 50ml，羧甲纤维素钠 2.5g， 纯化水加至 1000ml，方中羧甲纤维素钠是用作","groupStem":null,"options":["抑菌剂","助悬剂","润湿剂","絮凝剂","助溶剂"],"answer":"B","explanation":"根据金句纤维聚在一起很黏，可以作为助悬剂，羧甲纤维素钠常用作 混悬剂的助悬剂。","chapter":"","groupId":null},{"type":"A","num":23,"stem":"为不规则的厚片，外表面黑褐色或棕褐色，粗糙不平，有的可见须根痕或坚 硬的细须根残留，切面具有网状或放射状纹理；体轻，质硬，纤维性；气微，味 微苦而涩的饮片是","groupStem":null,"options":["藁本","升麻","威灵仙","地榆","羌活"],"answer":"B","explanation":"升麻饮片外表面黑褐色或棕褐色，切面具有网状或放射状纹理。","chapter":"","groupId":null},{"type":"A","num":24,"stem":"所含主要生物碱均为异喹啉类化合物的药材组别是","groupStem":null,"options":["山豆根和洋金花","黄连和防己","苦参和山豆根","苦参和防己","麻黄和黄连"],"answer":"B","explanation":"根据金句小英（罂）在午（乌）后（厚）严防黄连变异，黄连和防己 主要含有异喹啉类生物碱；山豆根主要含有双稠哌啶类生物碱，洋金花主要含有 莨菪烷类生物碱；苦参和山豆根主要含有双稠哌啶类生物碱；苦参主要含有双稠 哌啶类生物碱，防己主要含有异喹啉类生物碱；麻黄主要含有有机胺类生物碱， 黄连主要含有异喹啉类生物碱。","chapter":"","groupId":null},{"type":"A","num":25,"stem":"可用于确定分子量的鉴定方法是","groupStem":null,"options":["质谱","紫外光谱","红外光谱","碳核磁共振谱","氢核磁共振谱"],"answer":"A","explanation":"根据金句分子质量，质谱可用于确定分子量。","chapter":"","groupId":null},{"type":"A","num":26,"stem":"关于蒲黄炭炮制方法及作用的说法，错误的是","groupStem":null,"options":["炒炭时应喷适量清水，灭尽火星","炒炭出锅后应摊开晾凉","应炒至焦黑色","宜采用中火炒炭","炒炭后止血作用增强"],"answer":"C","explanation":"蒲黄为花粉类药物，质轻，炒制时火力不可过大，炒制时火力过大容 易导致花粉飞扬或炒焦，影响其均匀受热，进而影响药性和疗效，并且也可能起 火或烟雾过大，存在安全风险，蒲黄通常炒至棕褐色即可，故 C 错误。","chapter":"","groupId":null},{"type":"A","num":27,"stem":"连翘中主要化学成分连翘苷的结构类型是","groupStem":null,"options":["有机酸类","香豆素类","倍半萜类","蒽醌类","木脂素类"],"answer":"E","explanation":"根据金句厚五指连心，五味子、厚朴、连翘、细辛主要含有木脂素类 成分，连翘苷属于木脂素类化合物。","chapter":"","groupId":null},{"type":"A","num":28,"stem":"关于栓剂特点和质量要求的说法，错误的是","groupStem":null,"options":["除另有规定外，水溶性基质栓剂的融变时限为 30 分钟","可避免药物对胃肠道的刺激","直肠栓以鱼雷形较为常用","栓剂塞入人体腔道后，在体温下应能够融化、软化或溶化","栓剂可用于局部治疗或全身治疗"],"answer":"A","explanation":"根据金句在水一方，除另有规定外，水溶性基质栓剂的融变时限为 1 小时（60 分钟）。","chapter":"","groupId":null},{"type":"A","num":29,"stem":"《中国药典》规定，以东莨菪碱和莨菪碱为含量测定指标成分的药材是","groupStem":null,"options":["延胡索","千里光","天仙子","川乌","马钱子"],"answer":"C","explanation":"根据金句洋仙子浪荡，天仙子主要含有莨菪烷类生物碱，天仙子以东 莨菪碱和莨菪碱为含量测定指标成分。","chapter":"","groupId":null},{"type":"A","num":30,"stem":"呈不规则的块状和脂膏状，具强烈而持久的特异臭气的药材是","groupStem":null,"options":["血竭","乳香","没药","阿魏","草果"],"answer":"D","explanation":"阿魏呈不规则的块状和脂膏状，具强烈而持久的特异臭气。","chapter":"","groupId":null},{"type":"A","num":31,"stem":"经黏膜给药的速效剂型是","groupStem":null,"options":["糊剂","舌下片","贴膏剂","涂膜剂","贴剂"],"answer":"B","explanation":"舌下片通过舌下黏膜进行吸收，不需要经过胃肠道，药物能够迅速起 效，例如硝酸甘油舌下片可用于急性心绞痛。","chapter":"","groupId":null},{"type":"A","num":32,"stem":"鉴别药材组织中草酸钙结晶的方法是","groupStem":null,"options":["加硫酸不溶解","加钌红试液呈红色","加碘试液显棕色或黄棕色","加苏丹Ⅲ试液呈橘红色或紫红色","加稀醋酸不溶解，加稀盐酸溶解而无气泡产生"],"answer":"E","explanation":"草酸钙结晶加稀醋酸不溶解，加稀盐酸溶解而无气泡产生；硅质加硫 酸不溶解；黏液加钌红试液呈红色；糊粉粒加碘试液显棕色或黄棕色；脂肪油、 挥发油或树脂加苏丹Ⅲ试液呈橘红色、红色或紫红色。","chapter":"","groupId":null},{"type":"A","num":33,"stem":"关于片剂临床应用注意事项的说法，错误的是","groupStem":null,"options":["舌下片置于舌下含服，含后 30 分钟内不宜饮水","严禁直接服用或口含泡腾片","5 岁以下幼儿最好选用圈式中空的含片","应温开水整片送服缓释片","片剂不得掰开服用"],"answer":"E","explanation":"普通片、分散片可以掰开服用，而缓释片、控释片、肠溶片、包衣片 含有缓释、控释、肠溶或者包衣材料，不得掰开服用，故 E 错误。","chapter":"","groupId":null},{"type":"A","num":34,"stem":"固体分散体中药物的分散状态不包括","groupStem":null,"options":["无定形状态分散","微囊化分散","微晶分散","胶态分散","分子分散"],"answer":"B","explanation":"固体分散体是将药物以分子、胶态、微晶或无定形状态分散在水溶性 载体材料、难溶性载体材料或肠溶性载体材料中形成的固体分散物，因此固体分 散体中药物的分散状态不包括微囊化分散。","chapter":"","groupId":null},{"type":"A","num":35,"stem":"关于药物透皮吸收影响因素的说法，错误的是","groupStem":null,"options":["适度增加皮肤水合作用有利于药物的透皮吸收","基质的 pH 大于弱碱性药物的 pKa 时，有利于药物的透皮吸收","适度提高皮肤温度有利于药物的透皮吸收","水溶性药物比脂溶性药物易于穿透皮肤","药物在不同部位的皮肤透皮吸收存在差异"],"answer":"D","explanation":"皮肤角质层主要含有脂溶性成分，根据相似相溶的原理，脂溶性药物 比水溶性药物更容易穿透皮肤。","chapter":"","groupId":null},{"type":"A","num":36,"stem":"取火柴杆浸入本品水浸液中，使轻微着色，待干燥后，再浸入盐酸中立即取 出，置火焰附近烘烤，杆上即显深红色的药材是","groupStem":null,"options":["五倍子","青黛","海金沙","冰片","儿茶"],"answer":"E","explanation":"取火柴杆浸入儿茶水浸液中，使轻微着色，待干燥后，再浸入盐酸中 立即取出，置火焰附近烘烤，杆上即显深红色。","chapter":"","groupId":null},{"type":"A","num":37,"stem":"绵马贯众的原植物属于","groupStem":null,"options":["兰科","鳞毛蕨科","蓼科","蚌壳蕨科","百合科"],"answer":"B","explanation":"根据金句鳞毛贯众 513，绵马贯众来源于鳞毛蕨科。","chapter":"","groupId":null},{"type":"A","num":38,"stem":"呈类圆形或椭圆形厚片，外表皮灰黄或灰棕色，切面黄绿色、黄棕色或棕褐 色，内皮层环纹明显，散在“筋脉”小点的饮片是","groupStem":null,"options":["黄精","泽泻","莪术","射干","土茯苓"],"answer":"C","explanation":"莪术切面黄绿色、黄棕色或棕褐色，内皮层环纹明显，散在“筋脉” 小点。","chapter":"","groupId":null},{"type":"A","num":39,"stem":"可作为眼用制剂黏度调节剂的是","groupStem":null,"options":["硼酸","硼砂","三氯叔丁醇","苯酚","甲基纤维素"],"answer":"E","explanation":"根据金句纤维聚在一起很黏，甲基纤维素常作为眼用制剂的黏度调节 剂；硼酸、硼砂常作为眼用制剂的渗透压调节剂；三氯叔丁醇常作为眼用制剂的 抑菌剂；苯酚常作为注射剂的抑菌剂。","chapter":"","groupId":null},{"type":"A","num":40,"stem":"颗粒剂粒度检查时，除另有规定外，不能通过一号筛与能通过五号筛的总和 不得过","groupStem":null,"options":["15%","8%","5%","18%","10%"],"answer":"A","explanation":"根据金句 1 和 5 合起来就是 15，颗粒剂粒度检查时，除另有规定外， 不能通过一号筛与能通过五号筛的总和不得过 15%。","chapter":"","groupId":null},{"type":"B","num":41,"stem":"除另有规定外，内服散剂为","groupStem":"A.粗粉　　B.细粉　　C.中粉　　D.极细粉　　E.最细粉","options":["粗粉","细粉","中粉","极细粉","最细粉"],"answer":"B","explanation":"","chapter":"","groupId":"B1"},{"type":"B","num":42,"stem":"除另有规定外，眼用散剂为","groupStem":"A.粗粉　　B.细粉　　C.中粉　　D.极细粉　　E.最细粉","options":["粗粉","细粉","中粉","极细粉","最细粉"],"answer":"D","explanation":"","chapter":"","groupId":"B1"},{"type":"B","num":43,"stem":"除另有规定外，儿科或局部用散剂为","groupStem":"A.粗粉　　B.细粉　　C.中粉　　D.极细粉　　E.最细粉","options":["粗粉","细粉","中粉","极细粉","最细粉"],"answer":"E","explanation":"除另有规定外，内服散剂应为细粉；眼用散剂应为极细粉，且应无菌； 儿科及局部用散剂应为最细粉。","chapter":"","groupId":"B1"},{"type":"B","num":44,"stem":"主产于青藏高原地区的药材是","groupStem":"A.红景天　　B.附子　　C.蛤蟆油　　D.太子参　　E.酸枣仁","options":["红景天","附子","蛤蟆油","太子参","酸枣仁"],"answer":"A","explanation":"","chapter":"","groupId":"B2"},{"type":"B","num":45,"stem":"主产于河北，陕西地区的药材是","groupStem":"A.红景天　　B.附子　　C.蛤蟆油　　D.太子参　　E.酸枣仁","options":["红景天","附子","蛤蟆油","太子参","酸枣仁"],"answer":"E","explanation":"红景天主产于青藏高原地区，属于藏药；酸枣仁主产于河北、陕西， 属于北药；附子主产于四川，属于川药；蛤蟆油主产于黑龙江、吉林、辽宁，属 于关药；太子参主产于江苏，属于华南药。","chapter":"","groupId":"B2"},{"type":"B","num":46,"stem":"酸性最强的化合物是","groupStem":"A.3′-羟基黄酮　　B.4′-羟基黄酮　　C.5′-羟基黄酮　　D.7′-羟基黄酮　　E.7，4′-二羟基黄酮","options":["3′-羟基黄酮","4′-羟基黄酮","5′-羟基黄酮","7′-羟基黄酮","7，4′-二羟基黄酮"],"answer":"E","explanation":"","chapter":"","groupId":"B3"},{"type":"B","num":47,"stem":"酸性最弱的化合物是","groupStem":"A.3′-羟基黄酮　　B.4′-羟基黄酮　　C.5′-羟基黄酮　　D.7′-羟基黄酮　　E.7，4′-二羟基黄酮","options":["3′-羟基黄酮","4′-羟基黄酮","5′-羟基黄酮","7′-羟基黄酮","7，4′-二羟基黄酮"],"answer":"C","explanation":"根据金句气势一般无，黄酮类化合物的酸性强弱是：7，4′-二 OH ＞7-或 4′-0H＞一般酚羟基＞5-OH。因此，酸性最强的化合物是 7，4′-二 OH 黄酮，酸性最弱的化合物是 5-OH 黄酮。","chapter":"","groupId":"B3"},{"type":"B","num":48,"stem":"明胶空心胶囊制备时，甘油可作为","groupStem":"A.增稠剂　　B.增塑剂　　C.芳香矫味剂　　D.遮光剂　　E.防腐剂","options":["增稠剂","增塑剂","芳香矫味剂","遮光剂","防腐剂"],"answer":"B","explanation":"","chapter":"","groupId":"B4"},{"type":"B","num":49,"stem":"明胶空心胶囊制备时，琼脂可作为","groupStem":"A.增稠剂　　B.增塑剂　　C.芳香矫味剂　　D.遮光剂　　E.防腐剂","options":["增稠剂","增塑剂","芳香矫味剂","遮光剂","防腐剂"],"answer":"A","explanation":"","chapter":"","groupId":"B4"},{"type":"B","num":50,"stem":"明胶空心胶囊制备时，二氧化钛可作为","groupStem":"A.增稠剂　　B.增塑剂　　C.芳香矫味剂　　D.遮光剂　　E.防腐剂","options":["增稠剂","增塑剂","芳香矫味剂","遮光剂","防腐剂"],"answer":"D","explanation":"根据金句塑造纤细身材要少吃油，多吃梨，甘油可作为胶囊剂的增塑 剂；根据金句琼浆玉液，浆很黏稠，琼脂可作为胶囊剂的增稠剂；根据金句太阳 很晒，要遮光，二氧化钛可作为可作为胶囊剂的遮光剂。","chapter":"","groupId":"B4"},{"type":"B","num":51,"stem":"结构为四环三萜化合物的是","groupStem":"A.人参皂苷 Rg1　　B.甘草酸　　C.柴胡皂苷 a　　D.知母皂苷 BⅡ　　E.商陆皂苷 A","options":["人参皂苷 Rg1","甘草酸","柴胡皂苷 a","知母皂苷 BⅡ","商陆皂苷 A"],"answer":"A","explanation":"","chapter":"","groupId":"B5"},{"type":"B","num":52,"stem":"结构为甾体皂苷化合物的是","groupStem":"A.人参皂苷 Rg1　　B.甘草酸　　C.柴胡皂苷 a　　D.知母皂苷 BⅡ　　E.商陆皂苷 A","options":["人参皂苷 Rg1","甘草酸","柴胡皂苷 a","知母皂苷 BⅡ","商陆皂苷 A"],"answer":"D","explanation":"","chapter":"","groupId":"B5"},{"type":"B","num":53,"stem":"结构含有葡萄糖醛酸的是","groupStem":"A.人参皂苷 Rg1　　B.甘草酸　　C.柴胡皂苷 a　　D.知母皂苷 BⅡ　　E.商陆皂苷 A","options":["人参皂苷 Rg1","甘草酸","柴胡皂苷 a","知母皂苷 BⅡ","商陆皂苷 A"],"answer":"B","explanation":"人参皂苷 Rg1为四环三萜，知母皂苷 BⅡ为甾体皂苷，甘草酸（甘草 皂苷）、柴胡皂苷 a、商陆皂苷 A 为五环三萜。甘草酸（甘草皂苷）结构中含有 两分子葡萄糖醛酸，经水解可生成一分子的甘草次酸（甘草皂苷元）和两分子的 葡萄糖醛酸。","chapter":"","groupId":"B5"},{"type":"B","num":54,"stem":"合剂在添加蔗糖时，除另有规定外，含糖量不高于","groupStem":"A.10%（g/ml）　　B.20%（g/ml）　　C.45%（g/ml）　　D.65%（g/ml）　　E.85%（g/ml）","options":["10%（g/ml）","20%（g/ml）","45%（g/ml）","65%（g/ml）","85%（g/ml）"],"answer":"B","explanation":"","chapter":"","groupId":"B6"},{"type":"B","num":55,"stem":"单糖浆含糖量为","groupStem":"A.10%（g/ml）　　B.20%（g/ml）　　C.45%（g/ml）　　D.65%（g/ml）　　E.85%（g/ml）","options":["10%（g/ml）","20%（g/ml）","45%（g/ml）","65%（g/ml）","85%（g/ml）"],"answer":"E","explanation":"","chapter":"","groupId":"B6"},{"type":"B","num":56,"stem":"糖浆剂含糖量不低于","groupStem":"A.10%（g/ml）　　B.20%（g/ml）　　C.45%（g/ml）　　D.65%（g/ml）　　E.85%（g/ml）","options":["10%（g/ml）","20%（g/ml）","45%（g/ml）","65%（g/ml）","85%（g/ml）"],"answer":"C","explanation":"根据金句合二为一，合剂在添加蔗糖时，除另有规定外，含糖量不高 于 20%（g/ml）；单糖浆是蔗糖的饱和水溶液，含糖量为 85%（g/ml）；糖浆剂含 糖量不低于 45%（g/ml）。","chapter":"","groupId":"B6"},{"type":"B","num":57,"stem":"黄芪的性状鉴别术语是","groupStem":"A.狮子头　　B.蚯蚓头　　C.菊花心　　D.朱砂点　　E.云锦状花纹","options":["狮子头","蚯蚓头","菊花心","朱砂点","云锦状花纹"],"answer":"C","explanation":"","chapter":"","groupId":"B7"},{"type":"B","num":58,"stem":"党参的性状鉴别术语是","groupStem":"A.狮子头　　B.蚯蚓头　　C.菊花心　　D.朱砂点　　E.云锦状花纹","options":["狮子头","蚯蚓头","菊花心","朱砂点","云锦状花纹"],"answer":"A","explanation":"根据金句黄白色的菊花和绿草被风吹散，黄芪、白芍、甘草、防风断 面有细密的放射状纹理，形如开放的菊花，习称“菊花心”；根据金句共产党是 头雄狮，党参根头部有多数疣状突起的茎痕及芽，习称“狮子头”。","chapter":"","groupId":"B7"},{"type":"B","num":59,"stem":"银柴胡的药用部位是","groupStem":"A.根　　B.根茎　　C.块根　　D.块茎　　E.鳞茎","options":["根","根茎","块根","块茎","鳞茎"],"answer":"A","explanation":"","chapter":"","groupId":"B8"},{"type":"B","num":60,"stem":"泽泻的药用部位是","groupStem":"A.根　　B.根茎　　C.块根　　D.块茎　　E.鳞茎","options":["根","根茎","块根","块茎","鳞茎"],"answer":"D","explanation":"银柴胡为根入药；根据金句唬几下，两天三泻，快禁，泽泻为块茎入 药。","chapter":"","groupId":"B8"},{"type":"B","num":61,"stem":"图示中药为茜草的是","groupStem":"A.　　B.　　C.　　D.　　E.","options":["","","","",""],"answer":"B","explanation":"","chapter":"","groupId":"B9"},{"type":"B","num":62,"stem":"图示中药为威灵仙的是","groupStem":"A.　　B.　　C.　　D.　　E.","options":["","","","",""],"answer":"A","explanation":"A 是威灵仙，药材呈不规则的段，表面黑褐色；B 是茜草，根呈圆柱 形，略弯曲，表面红棕色；C 是徐长卿，根呈细长圆柱形，表面淡棕黄色；D 是 紫菀，药材外表面紫红色，根茎簇生多数细根，多编成辫状；E 是细辛，药材呈 不规则圆柱形，表面灰棕色。","chapter":"","groupId":"B9"},{"type":"B","num":63,"stem":"图示中药为肉桂的是","groupStem":"A.　　B.　　C.　　D.　　E.","options":["","","","",""],"answer":"A","explanation":"","chapter":"","groupId":"B9"},{"type":"B","num":64,"stem":"图示中药为秦皮的是","groupStem":"A.　　B.　　C.　　D.　　E.","options":["","","","",""],"answer":"B","explanation":"A 是肉桂，药物呈卷筒状，表面有灰白色斑纹；B 是秦皮，药物呈槽 状，外表面灰棕色；C 是厚朴，药物呈双卷筒状，表面灰褐色；D 是杜仲，呈板 片状，断面有细密、银白色、富弹性的橡胶丝相连；E 是地骨皮，呈槽状，外表 面棕黄色，有不规则的纵裂纹。","chapter":"","groupId":"B9"},{"type":"B","num":65,"stem":"呈丝片状，上表面绿色，黄绿色或浅黄色，下表面灰绿色，网脉明显，中脉 及细脉凸出，边缘具黄色刺毛状细锯齿，近革质，气微，味微苦的饮片是","groupStem":"A.番泻叶　　B.枇杷叶　　C.淫羊藿　　D.侧柏叶　　E.罗布麻叶","options":["番泻叶","枇杷叶","淫羊藿","侧柏叶","罗布麻叶"],"answer":"C","explanation":"","chapter":"","groupId":"B10"},{"type":"B","num":66,"stem":"多分枝，小枝扁平，叶细小鳞片状，交互对生，贴伏于枝上，深绿色或黄绿 色，质脆，易折断，气清香，味苦涩，微辛的饮片是","groupStem":"A.番泻叶　　B.枇杷叶　　C.淫羊藿　　D.侧柏叶　　E.罗布麻叶","options":["番泻叶","枇杷叶","淫羊藿","侧柏叶","罗布麻叶"],"answer":"D","explanation":"淫羊藿叶片边缘具黄色刺毛状细锯齿，近革质；侧柏叶叶呈小鳞片状， 交互对生，贴伏于枝上，深绿色或黄绿色。","chapter":"","groupId":"B10"},{"type":"B","num":67,"stem":"制剂基质由硬脂酸，单硬脂酸甘油酯，三乙醇胺，甘油，蒸馏水等组成，其 剂型是","groupStem":"A.凝胶剂　　B.乳膏剂　　C.黑膏药　　D.贴膏剂　　E.贴剂","options":["凝胶剂","乳膏剂","黑膏药","贴膏剂","贴剂"],"answer":"B","explanation":"","chapter":"","groupId":"B11"},{"type":"B","num":68,"stem":"制剂基质由植物油与红丹经高温炼制而成，其剂型是","groupStem":"A.凝胶剂　　B.乳膏剂　　C.黑膏药　　D.贴膏剂　　E.贴剂","options":["凝胶剂","乳膏剂","黑膏药","贴膏剂","贴剂"],"answer":"C","explanation":"单硬脂酸甘油酯可增加乳膏剂中油相的吸水能力，硬脂酸、三乙醇胺 可形成乳膏剂的乳化剂，因此制剂基质由硬脂酸，单硬脂酸甘油酯，三乙醇胺， 甘油，蒸馏水等组成，其剂型是乳膏剂；黑膏药的基质原料主要是植物油和红丹， 制剂基质由植物油与红丹经高温炼制而成，其剂型是黑膏药。","chapter":"","groupId":"B11"},{"type":"B","num":69,"stem":"呈圆柱形，略弯曲，表面棕褐色至黑褐色，节间缩短，呈紧密隆起的环状， 形似蚕，或节间延长，形如竹节状，节上有多数点状或瘤状突起的根痕及棕色破 碎鳞片的药材是","groupStem":"A.远志　　B.羌活　　C.重楼　　D.知母　　E.巴戟天","options":["远志","羌活","重楼","知母","巴戟天"],"answer":"B","explanation":"","chapter":"","groupId":"B12"},{"type":"B","num":70,"stem":"为扁圆柱形，略弯曲，表面灰黄色或暗灰色，具纹及横裂纹，质坚韧，断面 皮部厚，紫色或淡紫色，易与木部剥离的药材是","groupStem":"A.远志　　B.羌活　　C.重楼　　D.知母　　E.巴戟天","options":["远志","羌活","重楼","知母","巴戟天"],"answer":"E","explanation":"羌活有的节间缩短，呈紧密隆起的环状，形似蚕，称为“蚕羌”；巴 戟天皮部厚，紫色或淡紫色，易与木部剥离。","chapter":"","groupId":"B12"},{"type":"B","num":71,"stem":"将艾叶捣捻成绒状，或另加其他药料捻制成卷烟状或其他形状，供熏灼穴位 或其他患部的外用剂型是","groupStem":"A.棒剂　　B.条剂　　C.锭剂　　D.灸剂　　E.丹剂","options":["棒剂","条剂","锭剂","灸剂","丹剂"],"answer":"D","explanation":"","chapter":"","groupId":"B13"},{"type":"B","num":72,"stem":"汞及某些矿物药为原料，经高温炼制的含氧化汞的外用剂型是","groupStem":"A.棒剂　　B.条剂　　C.锭剂　　D.灸剂　　E.丹剂","options":["棒剂","条剂","锭剂","灸剂","丹剂"],"answer":"E","explanation":"将艾叶捣捻成绒状，或另加其他药料捻制成卷烟状或其他形状，供熏 灼 ","num":105,"stem":"柴胡泡腾片需进行的质量检查项目是","groupStem":null,"options":["发泡量","释放度","溶出度","崩解时限","融变时限"],"answer":"D","explanation":"柴胡泡腾片需检查崩解时限，泡腾片的崩解时限为 5 分钟。注意此题 容易错选发泡量，阴道泡腾片才需要检查发泡量。","chapter":"","groupId":"C24"},{"type":"C","num":106,"stem":"小柴胡颗粒含量测定指标成分黄芩苷的化学结构类型是","groupStem":null,"options":["黄酮醇苷","黄酮苷","二氢黄酮苷","二氢黄酮醇苷","异黄酮苷"],"answer":"B","explanation":"黄芩苷属于黄酮苷。","chapter":"","groupId":"C24"},{"type":"C","num":107,"stem":"柴胡舒肝丸含量测定指标成分厚朴酚、和厚朴酚的化学结构类型是","groupStem":null,"options":["酯类","香豆素类","萜类","木脂素类","黄酮类"],"answer":"D","explanation":"厚朴酚、和厚朴酚属于木脂素类成分。 案例 3：某男，43 岁。症见胁肋疼痛、胸闷痞满、食滞不清、呕吐酸水，脉弦。 医师处以中成药柴胡舒肝丸，该蜜丸处方是由茯苓、麸炒枳壳、豆蔻、酒白芍、 甘草、醋香附、陈皮、桔梗、姜厚朴、炒山楂、防风、六神曲（炒）、柴胡、黄 芩、薄荷、紫苏梗、木香、炒槟榔、醋三棱、酒大黄、青皮（炒）、当归、姜半 夏、乌药、醋莪术组成。","chapter":"","groupId":"C24"},{"type":"C","num":108,"stem":"处方中六神曲为炒品，其生品的制法是","groupStem":null,"options":["复制法","制霜法","发酵法","发芽法","拌衣法"],"answer":"C","explanation":"六神曲采用发酵法炮制。","chapter":"","groupId":"C24"},{"type":"C","num":109,"stem":"柴胡疏肝丸可制成小蜜丸或大蜜丸，除另有规定外，所含水分不得过","groupStem":null,"options":["9.0%","10.0%","12.0%","13.0%","15.0%"],"answer":"E","explanation":"根据金句 8 月 15，中秋团圆甜如蜜，蜜丸、浓缩蜜丸所含的水分不 得过 15.0%。","chapter":"","groupId":"C24"},{"type":"C","num":110,"stem":"本品显微镜检查，可见韧皮纤维淡黄色，梭形，壁厚，孔沟细。处方中具有 该特征的饮片是","groupStem":null,"options":["酒大黄","黄芩","茯苓","炒槟榔","甘草"],"answer":"B","explanation":"黄芩显微可见皮纤维淡黄色，梭形，壁厚，孔沟细。","chapter":"","groupId":"C24"},{"type":"X","num":111,"stem":"中药材质量直接关系到临床疗效，影响中药材质量的因素有（多选）","groupStem":null,"options":["品种","产地","栽培","采收加工","贮藏养护"],"answer":"ABCDE","explanation":"中药材生产过程中，中药的品种、产地、种养环境（栽培）、采收加 工及贮藏养护都会影响中药材的质量。","chapter":"","groupId":null},{"type":"X","num":112,"stem":"属于动物生理产物的药材有（多选）","groupStem":null,"options":["蛇蜕","珍珠","僵蚕","麝香","蟾酥"],"answer":"ADE","explanation":"蛇蜕是蛇蜕下的干燥表皮膜，麝香是麝成熟雄体香囊中的干燥分泌物， 蟾酥是蟾蜍的干燥分泌物，蛇蜕、麝香、蟾酥都是属于动物的生理产物。珍珠是 珍珠贝科动物受刺激形成，僵蚕是家蚕幼虫感染白僵菌致死的干燥体，珍珠、僵 蚕都属于动物的病理产物。","chapter":"","groupId":null},{"type":"X","num":113,"stem":"性状鉴别横断面可见异常构造的药材有（多选）","groupStem":null,"options":["牛膝","商陆","何首乌","大黄","茅苍术"],"answer":"ABCD","explanation":"牛膝断面有多数黄白色点状异型维管束，习称“筋脉点”；商陆断面 有异型维管束隆起，形成数个突起的同心性环轮，习称“罗盘纹”；何首乌皮部 有 4-11 个类圆形异型维管束环列，形成“云锦花纹”；大黄根茎髓部有异型维管 束散在，形成“筋脉点”。茅苍术断面有多数棕红色或橙黄色油点（油室），习称 “朱砂点”，油点（油室）属于药物的正常构造，因此 ABCD 正确。","chapter":"","groupId":null},{"type":"X","num":114,"stem":"关于注射剂质量要求的说法，正确的有（多选）","groupStem":null,"options":["乳状液型注射液不得用于椎管内注射","除另有规定外，注射剂应避光贮存","乳状液型注射液不得有相分离现象","输液剂应尽可能与血液等渗","混悬型注射液中原料药物粒径应控制在 15μm 以下"],"answer":"ABCDE","explanation":"以上五个选项说法全部正确。","chapter":"","groupId":null},{"type":"X","num":115,"stem":"液体制剂中属于多相分散体系的有（多选）","groupStem":null,"options":["乳浊液","混悬液","溶胶","高分子溶液","真溶液"],"answer":"ABC","explanation":"乳浊液、混悬液、溶胶都属于非均相分散体系，即多相分散体系；高 分子溶液、真溶液都属于均相分散体系，即单相分散体系。","chapter":"","groupId":null},{"type":"X","num":116,"stem":"通过胃肠道吸收而发挥治疗作用的口服片有（多选）","groupStem":null,"options":["分散片","口崩片","咀嚼片","泡腾片","含片"],"answer":"ABCD","explanation":"分散片、口崩片、咀嚼片、泡腾片药物通过胃肠道吸收而发挥治疗作 用，含片药物是通过口腔黏膜和咽喉黏膜进行吸收。","chapter":"","groupId":null},{"type":"X","num":117,"stem":"对症功效是指某些中药能缓解或消除疾病过程中出现的某些或某种症状，有 助于减轻患者痛苦，防止病情恶化。下列属于对症功效的有（多选）","groupStem":null,"options":["祛风湿","平喘","泻下","止血","通鼻窍"],"answer":"BD","explanation":"平喘是止住喘息的症状，止血是止住流血的症状，都属于对症功效。 祛风湿、通鼻窍属于对病症功效，泻下属于对因功效。","chapter":"","groupId":null},{"type":"X","num":118,"stem":"《中国药典》规定，测定挥发油含量的中药材有（多选）","groupStem":null,"options":["穿心莲","肉桂","薄荷","龙胆","莪术"],"answer":"BCE","explanation":"肉桂、薄荷油、莪术主要含有挥发油类成分，需测定挥发油的含量。 穿心莲、龙胆主要含有萜类成分。","chapter":"","groupId":null},{"type":"X","num":119,"stem":"粉末显微鉴别特征中有油细胞的药材有（多选）","groupStem":null,"options":["五味子","厚朴","当归","丁香","白术"],"answer":"AB","explanation":"五味子、厚朴粉末显微鉴别特征中具有油细胞。","chapter":"","groupId":null},{"type":"X","num":120,"stem":"可采用黄酒炮制，并增强活血祛瘀作用的中药有（多选）","groupStem":null,"options":["黄连","白芍","当归","丹参","黄芩"],"answer":"CD","explanation":"酒当归活血通经、祛瘀止痛作用增强，酒丹参药物寒凉之性缓和，活 血祛瘀，调经止痛功能增强，因此当归、丹参可采用黄酒炮制，并增强活血祛瘀 的作用。酒黄连引药上行，缓其寒性，善清头目之火；酒白芍药物酸寒之性降低， 入血分，调经止血，柔肝止痛；酒黄芩用于上焦肺热及四肢肌表湿热，缓和苦寒 之性，以免伤害脾阳。","chapter":"","groupId":null}]},{"id":"2024中药二","subject":"中药二","year":"2024"

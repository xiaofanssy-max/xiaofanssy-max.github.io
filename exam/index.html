,{"type":"C","num":94,"stem":"根据辨证结果，应采用的治法是（）","groupStem":"某男，36 岁。患痔疮 3 年余，近 1 周工作劳累，生活不规律，排便异常，导致痔疮发作， 症见便血鲜红，量多，肛门灼热，肛内肿物外脱；舌红苔黄腻，脉弦数。","options":["清热凉血祛风","补中益气升陷","理气祛风活血","泻火解毒止痛","清热利湿止血"],"answer":"E","explanation":"湿热下注证的核心病机是\"湿热蕴结肛门、灼伤血络\"，治法需\"清热利湿止血\"，清除湿热并 止血；A（清热凉血祛风）治风伤肠络证，B（补中益气升陷）治脾虚气陷证，C（理气祛风活血）治气 滞血瘀证，D（泻火解毒止痛）治热毒炽盛证，均不适配。","chapter":"","groupId":"C21"},{"type":"C","num":95,"stem":"治疗宜选用的基础方剂是（）","groupStem":"某男，36 岁。患痔疮 3 年余，近 1 周工作劳累，生活不规律，排便异常，导致痔疮发作， 症见便血鲜红，量多，肛门灼热，肛内肿物外脱；舌红苔黄腻，脉弦数。","options":["脏连丸","凉血地黄汤","右归丸","补中益气汤","止痛如神汤"],"answer":"A","explanation":"A（脏连丸）功效为清肠止血，可清热利湿、止血，适配湿热下注型痔疮；B（凉血地黄汤） 治风伤肠络证，C（右归丸）治肾阳不足证，D（补中益气汤）治脾虚气陷证，E（止痛如神汤）治气滞 血瘀证，均与证型不符。","chapter":"","groupId":"C21"},{"type":"X","num":96,"stem":"反治，又称从治，是顺从疾病证候的外在假象而治的治疗法则。属于反治的有（）","groupStem":null,"options":["以寒治寒","以热治热","以热治寒","以寒治热","以通治通"],"answer":"ABE","explanation":"反治是\"顺从假象\"的治法，包括：A（以寒治寒）治真热假寒证，用寒凉药针对内热；B（以热治 热）治真寒假热证，用温热药针对内寒；E（以通治通）治真实假虚证（如热结旁流），用通下药针对内结； C（以热治寒）、D（以寒治热）为正治（逆治），直接针对疾病本质，故排除。","chapter":"","groupId":null},{"type":"X","num":97,"stem":"中药注射剂合理应用的基本原则有（）","groupStem":null,"options":["加强用药监护","严禁联合应用","严格掌握适应证","严格掌握用法用量","过敏体质者慎用"],"answer":"ACDE","explanation":"中药注射剂使用需遵循安全原则：A（加强用药监护）防止不良反应发生；C（严格掌握适应证） 避免滥用；D（严格掌握用法用量）防止剂量不当引发风险；E（过敏体质者慎用）减少过敏反应；B 错误， 中药注射剂不是绝对禁止联合应用，而是需谨慎评估。","chapter":"","groupId":null},{"type":"X","num":98,"stem":"体现肺与肾之间关系的生理功能有（）","groupStem":null,"options":["津液代谢","阴液互滋","阴阳互资","血液运行","呼吸运动"],"answer":"ABE","explanation":"肺肾关系主要体现在：A（津液代谢）肺主通调水道，肾主水液代谢，共同调节津液；B（阴液互 滋）肺阴与肾阴相互滋养（肺为水之上源，肾为水之下源）；E（呼吸运动）肺主呼吸，肾主纳气，共同维 持呼吸深度；C（阴阳互资）为五脏普遍关系，非肺肾特有；D（血液运行）主要与心肺相关，故排除。","chapter":"","groupId":null},{"type":"X","num":99,"stem":"虚劳病证以补益为治疗原则，分别采用补气、养血、滋阴、温阳之法。其中，阴虚证宜选用的中成药有 （）","groupStem":null,"options":["薯蓣丸","河车大造丸","十一味参芪胶囊","归芪口服液","人参固本丸"],"answer":"BE","explanation":"适配阴虚证的中成药需有\"滋阴\"功效：B（河车大造丸）滋阴清热、补肾益肺，治肺肾阴虚；E（人 参固本丸）滋阴益气、固本培元，治阴虚证；A（薯蓣丸）、C（十一味参芪胶囊）、D（归芪口服液）均以 补气为主，治气虚证，故排除。 X 型题（多项选择题）","chapter":"","groupId":null},{"type":"X","num":100,"stem":"频服是指少量多次、频频服用的方法。宜频服的方剂有（）","groupStem":null,"options":["大黄牡丹汤","麦门冬汤","奔豚汤","苦酒汤","半夏汤"],"answer":"DE","explanation":"频服的核心目的是让药物持续作用于局部（如咽喉）或缓慢发挥药效，避免一次性服用刺激机体： D（苦酒汤）主治咽喉肿痛、声音嘶哑，需药物持续接触咽喉黏膜，通过频服使药液长时间停留局部，增强 消肿利咽效果，故宜频服；E（半夏汤）主治\"少阴病，咽中痛\"，同样针对咽喉局部病症，频服可让药物持 续作用于病灶，缓解咽痛，故宜频服；A（大黄牡丹汤）为泻下剂，需一次性服用以集中药力通便，不宜频 服；B（麦门冬汤）主治肺胃阴虚证，常规煎煮后分服即可，无需频服；C（奔豚汤）主治奔豚气（气上冲 胸），需一次性服用以快速平息气逆，不宜频服。","chapter":"","groupId":null}]},{"id":"2025法规","subject":"法规","year":"2025","label":"2025年法规真题","total":100,"questions":[{"type":"A","num":1,"stem":"关于药品上市许可持有人经营活动的说法，错误的是（）","groupStem":null,"options":["发起药品追回后，须督促药品经营企业、医疗机构等予以配合","应当将销售凭证保存至少 5 年，且不少于药品有效期满后 1 年","委托销售其持有药品时，须确保受托方为药品经营企业","应当落实其持有药品经营全过程质量管理责任"],"answer":"A","explanation":"根据《药品管理法》及《药品召回管理办法》，药品召回由药品上市许可持有人发起， 需督促药品经营企业、医疗机构配合；而\"药品追回\"通常是药品经营企业（如批发企业）针对 已售出药品的追回行为，并非由持有人发起。该选项混淆\"药品召回\"与\"药品追回\"的主体及责 任。B 选项持有人销售药品的销售凭证、记录保存时限需满足\"至少 5 年，且不少于药品有效 期满后 1 年\"；C 选项持有人委托销售药品时，受托方必须是具备合法资质的药品经营企业；D 选项持有人作为药品质量第一责任人，需对其持有药品的研制、生产、经营、使用全流程质量 管理负责。","chapter":"","groupId":null},{"type":"A","num":2,"stem":"下列不属于《药品生产许可证》注销情形的是（）","groupStem":null,"options":["《药品生产许可证》有效期届满未重新发证的","未按要求及时变更《药品生产许可证》登记事项的","主动申请注销《药品生产许可证》的","营业执照依法被吊销或者注销的"],"answer":"B","explanation":"根据《药品生产监督管理办法》，A 选项《药品生产许可证》有效期届满后，企业未 按规定申请重新发证的，原发证机关会依法办理许可证注销手续，该情形属于注销范畴；B 选 项未按要求及时变更许可证登记事项（如企业名称、法定代表人等），属于许可证变更管理中 的违规行为，药品监督管理部门会责令企业限期整改，而非直接注销许可证，该情形不属于注 销范畴；C 选项企业主动申请注销许可证是注销情形的明确规定之一，原发证机关会依法办理 注销并公示，该情形属于注销范畴；D 选项企业营业执照被吊销或注销，意味着企业法人资格 终止，无法继续从事药品生产活动，原发证机关需注销其《药品生产许可证》，该情形属于注 销范畴。","chapter":"","groupId":null},{"type":"A","num":3,"stem":"抗肿瘤药物临床应用实行分级管理，根据安全性、可及性、经济性等因素，将抗肿瘤药物分 为限制使用级和（）","groupStem":null,"options":["特殊使用级","非限制使用级","非特殊使用级","普通使用级"],"answer":"D","explanation":"根据抗肿瘤药物临床应用管理要求，结合药物安全性、可及性、经济性，抗肿瘤药物 明确分为\"限制使用级\"和\"普通使用级\"。其中，普通使用级药物安全性较高、可及性好，适合 常规临床场景；限制使用级药物因安全性风险、价格或供应等因素，需特定条件下使用。A 选 项\"特殊使用级\"是抗菌药物临床应用分级管理的分类，并非抗肿瘤药物的分级术语；B 选项\" 非限制使用级\"同样适用于抗菌药物分级；C 选项\"非特殊使用级\"不属于临床药物分级管理的 标准术语。","chapter":"","groupId":null},{"type":"A","num":4,"stem":"关于医疗机构中药饮片调剂与临方炮制的说法，错误的是（）","groupStem":null,"options":["中药饮片调配后，二级以上医院应当由主管中药师以上专业技术人员负责调剂复核工作，复 核率应当达到 100%","负责中药饮片临方炮制工作的，应当是具有 3 年以上炮制经验的中药学专业技术人员","调配中药饮片处方时，对存在可能引起用药安全问题的处方，应当由处方医师确认或重新开 具处方后方可调配","罂粟壳不得单方发药，必须凭有麻醉药品处方权的执业医师签名的处方调配，每张处方不得 超过 7 日用量"],"answer":"D","explanation":"根据医疗机构中药饮片管理相关规定，A 选项二级及以上医院中药饮片调配后，需由 主管中药师及以上专业技术人员负责复核，且复核率需达到 100%，确保调剂准确性，该说法 正确；B 选项临方炮制直接影响中药饮片质量与疗效，规定需由具备 3 年以上炮制经验的中药 学专业技术人员负责，符合中药饮片炮制的专业性要求，该说法正确；C 选项调配中药饮片处 方时，若发现处方存在用药安全隐患（如配伍禁忌、剂量异常等），必须由原处方医师确认或 重新开具处方，方可继续调配，这是保障用药安全的关键环节，该说法正确；D 选项罂粟壳作 为特殊管理的中药饮片，虽需凭有麻醉药品处方权的执业医师处方调配且不得单方发药，但根 据规定，每张处方的用量不得超过 3 日用量，而非 7 日用量，该说法错误。","chapter":"","groupId":null},{"type":"A","num":5,"stem":"下列属于《抗菌药物临床应用管理办法》所称抗菌药物的是（）","groupStem":null,"options":["治疗结核病的药物","治疗真菌感染的药物","具有抗菌作用的中药制剂","治疗病毒感染的药物"],"answer":"B","explanation":"根据《抗菌药物临床应用管理办法》，抗菌药物是指\"治疗细菌、支原体、衣原体、 立克次体、螺旋体、真菌等病原微生物所致感染性疾病病原的药物\"，治疗真菌感染的药物（如 氟康唑、伊曲康唑）符合该定义，属于抗菌药物。A 选项治疗结核病的药物（如异烟肼、利福 平）虽用于抗感染，但该办法明确将抗结核药、抗麻风病药等单独归类，不纳入该办法所定义 的\"抗菌药物\"范畴；C 选项该办法所指抗菌药物以化学药、生物制品为主，\"具有抗菌作用的 中药制剂\"虽有抗菌功效，但未被纳入该办法对\"抗菌药物\"的界定范围；D 选项抗菌药物针对 的是细菌、真菌等病原微生物，而病毒感染需使用抗病毒药物（如奥司他韦），抗病毒药物不 属于《抗菌药物临床应用管理办法》所称的抗菌药物。","chapter":"","groupId":null},{"type":"A","num":6,"stem":"下列属于行政法规的是（）","groupStem":null,"options":["《放射性药品管理办法》","《药品网络销售监督管理办法》","《药品不良反应报告和监测管理办法》","《生物制品批签发管理办法》"],"answer":"A","explanation":"行政法规由国务院制定并发布，以\"条例\"\"办法\"\"规定\"等为常见名称。A 选项《放射 性药品管理办法》由国务院制定颁布，属于行政法规范畴；B 选项《药品网络销售监督管理办 法》由国家市场监督管理总局制定发布，属于部门规章（国务院各部门制定的规范性文件）， 而非行政法规；C 选项《药品不良反应报告和监测管理办法》由原卫生部制定发布，属于部门 规章，并非国务院制定的行政法规；D 选项《生物制品批签发管理办法》由国家药品监督管理 局制定发布，属于部门规章，不符合行政法规的制定主体要求。","chapter":"","groupId":null},{"type":"A","num":7,"stem":"根据《中医药法》规定，医疗机构应用传统工艺配制中药制剂未依照规定备案，或者未按照 备案材料载明的要求配制中药制剂的，按（）","groupStem":null,"options":["未经许可配制医疗机构制剂","生产劣药","生产假药","无许可证生产药品"],"answer":"C","explanation":"根据《中医药法》规定，医疗机构应用传统工艺配制中药制剂需按要求备案，未备案 或未按备案要求配制的，直接按\"生产假药\"论处。A 选项\"未经许可配制医疗机构制剂\"针对的 是医疗机构未取得《医疗机构制剂许可证》或未按许可范围配制制剂的行为，而题干中\"应用 传统工艺配制中药制剂\"可通过备案而非许可方式开展，违规情形不匹配；B 选项\"生产劣药\" 通常指药品成分含量不符合标准、过期、污染等质量不合格情形，题干中未涉及药品质量问题， 而是备案或配制要求违规；D 选项\"无许可证生产药品\"针对的是未取得《药品生产许可证》从 事药品生产的行为，医疗机构配制中药制剂（含传统工艺备案类）不适用\"药品生产许可证\" 管理。","chapter":"","groupId":null},{"type":"A","num":8,"stem":"关于医疗机构药学服务模式转变的说法，错误的是（）","groupStem":null,"options":["从提供药品为主转变为提供优质、安全、人性化的药学专业技术服务为主","从\"以药品为中心\"转变为\"以患者为中心\"","从\"以药品调剂为中心\"转变为\"以保障药品质量为中心\"","从\"以保障药品供应为中心\"转变为\"在保障药品供应的基础上，以重点加强药学专业技术服 务、参与临床用药为中心\""],"answer":"C","explanation":"药学服务模式转变的核心是从\"以药品调剂（发药）为中心\"转变为\"以患者为中心、 以临床药学服务为重点\"，而非\"以保障药品质量为中心\"（药品质量保障是基础要求，并非模 式转变的方向）。A 选项医疗机构药学服务已从传统的\"发药\"向\"药学技术服务\"转型，重点提 供用药指导、药物治疗管理等专业服务，该说法符合模式转变要求，正确；B 选项\"以患者为 中心\"是现代药学服务的核心理念，取代传统\"以药品为中心\"的单一供给思维，该说法正确；D 选项在保障药品供应的基础上，强化药学专业技术服务（如参与临床查房、处方审核）是医疗 机构药学服务的重要转型方向，该说法正确。","chapter":"","groupId":null},{"type":"A","num":9,"stem":"某药品广告批准文号为：粤药广审（文）第 240602-00334 号。关于该文号含义的说法，正 确的是（）","groupStem":null,"options":["该广告有效期截止日是 2024 年 6 月 2 日","该广告只能在经批准的医药专业杂志上发布","该广告仅限在广东省行政区域内发布","该广告可在电视、网络等媒介上发布"],"answer":"A","explanation":"药品广告批准文号格式中，\"240602\"代表\"2024 年 6 月 2 日\"，根据规定，药品广告 批准文号有效期为 1 年，因此该广告有效期截止日为 2024 年 6 月 2 日。B 选项文号中\"（文） \"代表\"文字类广告\"，可在报纸、杂志、网络文字板块等媒介发布，并非\"仅限医药专业杂志\"； C 选项\"粤\"代表该广告由广东省药品监督管理部门审批，但药品广告可在全国范围内发布（需 符合当地广告监管要求），并非\"仅限广东省\"；D 选项\"（文）\"类广告仅限文字形式，不可在 电视（视频类）等非文字媒介发布。","chapter":"","groupId":null},{"type":"A","num":10,"stem":"根据《消费者权益保护法》，经营者听取消费者对其提供的商品或者服务的意见，属于经 营者（）","groupStem":null,"options":["保证质量的义务","提供信息的义务","接受监督的义务","保证安全的义务"],"answer":"C","explanation":"《消费者权益保护法》明确规定，经营者应当听取消费者对其商品或服务的意见，接 受消费者监督，该行为属于\"接受监督的义务\"。A 选项\"保证质量的义务\"指经营者需提供符合 质量要求的商品或服务（如符合国家标准），与\"听取消费者意见\"无关；B 选项\"提供信息的 义务\"指经营者需主动向消费者告知商品或服务的真实信息（如价格、成分），而非\"听取意见 \"；D 选项\"保证安全的义务\"指经营者需保障商品或服务不会对消费者人身、财产造成损害（如 警示安全风险），与题干行为不符。","chapter":"","groupId":null},{"type":"A","num":11,"stem":"关于药品检查的说法，错误的是（）","groupStem":null,"options":["派出检查单位负责组建检查组，检查组一般由 2 名以上检查员组成","省级药品监督管理部门负责本行政区域内药品上市许可持有人的相关检查","国家药品监督管理局主管全国药品检查管理工作","市县级药品监督管理部门负责辖区内药品网络交易第三方平台检查"],"answer":"D","explanation":"药品网络交易第三方平台的检查由省级药品监督管理部门负责，市县级药品监督管理 部门主要负责药品零售企业、使用单位的检查。A 选项根据《药品检查管理办法（试行）》， 派出检查单位需组建 2 名以上检查员组成的检查组，实行组长负责制，该说法正确；B 选项省 级药品监督管理部门承担本行政区域内药品上市许可持有人、药品生产企业等的检查职责，该 说法正确；C 选项国家药品监督管理局统一主管全国药品检查管理工作，指导地方药品监督管 理部门开展检查，该说法正确。","chapter":"","groupId":null},{"type":"A","num":12,"stem":"关于药品网络销售的说法，正确的是（）","groupStem":null,"options":["通过处方审核前，药品网络零售企业可以展示处方药的药品说明书","《药品网络销售禁止清单(第一版)》所列通用名称的品种均为单方制剂","药品网络交易第三方平台的医药健康服务板块首页可以展示处方药包装","药品网络交易第三方平台发现入驻平台的药品零售企业有违法行为的，应当及时制止"],"answer":"D","explanation":"第三方平台对入驻企业的药品销售活动有监督义务，发现违法行为时应当及时制止， 必要时停止提供平台服务并报告监管部门。A 选项根据《药品网络销售监督管理办法》，通过 处方审核前，药品网络零售企业不得展示处方药说明书（含功能主治、用法用量等信息）；B 选项《药品网络销售禁止清单(第一版)》中部分品种为复方制剂（如\"复方米非司酮\"），并非 \"均为单方制剂\"；C 选项第三方平台的医药健康服务板块首页不得展示处方药包装、标签等信 息，需在处方审核通过后才可展示相关内容。","chapter":"","groupId":null},{"type":"A","num":13,"stem":"根据《中医药法》规定，医疗机构应用传统工艺配制中药制剂未依照规定备案，或者未按 照备案材料载明的要求配制中药制剂的，按（）给予处罚。","groupStem":null,"options":["未经许可配制医疗机构制剂","生产劣药","生产假药","无许可证生产药品"],"answer":"C","explanation":"《中医药法》明确规定，医疗机构应用传统工艺配制中药制剂，必须按要求备案；未 备案或未按备案材料要求配制的，直接按\"生产假药\"论处并给予处罚。A 选项\"未经许可配制 医疗机构制剂\"针对的是医疗机构未取得《医疗机构制剂许可证》，或超出许可范围配制制剂 的行为，而\"应用传统工艺配制中药制剂\"可通过\"备案制\"而非\"许可制\"开展；B 选项\"生产劣 药\"的核心是药品质量不符合标准，题干中未涉及药品质量问题；D 选项\"无许可证生产药品\" 针对的是未取得《药品生产许可证》从事药品生产的行为，医疗机构配制中药制剂不纳入\"药 品生产许可证\"管理范畴。","chapter":"","groupId":null},{"type":"A","num":14,"stem":"药品三级召回的适用情形是（）","groupStem":null,"options":["使用该药品可能或者已经引起严重健康危害的","使用该药品可能危害人体健康，被药品监督管理部门依法查封、扣押的","使用该药品可能或者已经引起暂时或者可逆的健康危害的","使用该药品一般不会引起健康危害，但由于其他原因需要收回的"],"answer":"D","explanation":"根据《药品召回管理办法》，药品三级召回的核心界定是\"使用该药品一般不会引起 健康危害，但由于其他原因（如标签错误、包装瑕疵等）需要收回\"。A 选项\"使用该药品可能 或者已经引起严重健康危害\"，属于药品一级召回的适用情形（一级召回针对最严重的安全隐 患）；B 选项\"被药品监督管理部门依法查封、扣押的药品\"，属于监管部门对存在重大安全风 险药品采取的行政强制措施，并非药品召回的分类情形；C 选项\"使用该药品可能或者已经引 起暂时或者可逆的健康危害\"，属于药品二级召回的适用情形（二级召回针对中等程度安全隐 患）。","chapter":"","groupId":null},{"type":"A","num":15,"stem":"关于冷藏药品零售配送要求的说法，错误的是（）","groupStem":null,"options":["经验证后，无须在配送冷藏药品的保温箱内安装温度监测系统测点终端","配送冷藏药品的配送箱原则上应当符合药品批发企业冷藏箱(保温箱)的要求","冷藏药品严禁在配送过程中中转暂存","配送人员须接受相关法律法规和专业知识培训并经考核合格后方可上岗"],"answer":"A","explanation":"根据《药品经营质量管理规范附录 1（冷藏、冷冻药品的储存与运输管理）》及附录 3（温湿度自动监测），冷藏药品配送用保温箱必须安装温度监测系统测点终端，且需通过验 证确认测点位置合理性，确保全程实时监测温度。即使经验证，也需保留测点终端以持续监控 温度。B 选项药品零售配送冷藏药品的配送箱，需符合药品批发企业冷藏箱的技术要求，保障 配送过程温度稳定；C 选项冷藏药品在零售配送中严禁中转暂存，避免因中转导致温度失控； D 选项冷藏药品配送人员需接受冷链管理法律法规、专业知识培训，考核合格后方可上岗。","chapter":"","groupId":null},{"type":"A","num":16,"stem":"关于医疗机构药品采购管理的说法，错误的是（）","groupStem":null,"options":["医疗机构遴选儿童用药可不限于药品说明书中有明确儿童适应症和用法用量的药品，不受\" 一品两规\"和药品总品种数限制","除特殊情况外，同一通用名称药品的品种，注射剂型和口服剂型各不得超过 2 种","医疗机构应当按照经药品监督管理部门批准并公布的药品通用名称购进药品","医疗机构应合理设置临床必需急(抢)救药品库存警戒线，及时采购补充，原则上库存不少于 3 个月的用量"],"answer":"A","explanation":"医疗机构遴选儿童用药时，优先选择说明书中有明确儿童适应症和用法用量的药品； 确因临床需要选用无儿童适应症的药品时，需经过伦理审批等特殊程序，且仍需遵守\"一品两 规\"和药品总品种数限制，并非\"不受限制\"。B 选项\"一品两规\"是医疗机构药品采购的核心原 则，除特殊情况外，同一通用名药品的注射剂型、口服剂型各不得超过 2 种；C 选项医疗机构 必须按照药品监督管理部门批准的药品通用名购进药品；D 选项临床必需急（抢）救药品需设 置库存警戒线，原则上库存不少于 3 个月用量。","chapter":"","groupId":null},{"type":"A","num":17,"stem":"关于药品领域行政许可的说法，错误的是（）","groupStem":null,"options":["申请主体主要是企业法人、医疗机构、科研机构、自然人等","行政机关受理或者不予受理行政许可申请，均应当出具书面凭证","形式审查一般限于登记类事项，药品领域的审查均为实质审查","行政机关应当当场对申请材料进行审核，作出是否准予许可的决定"],"answer":"D","explanation":"药品行政许可中，仅简易程序（如部分备案事项）可当场审核决定；复杂事项（如药 品生产许可、注册许可）需经技术审评、现场检查等流程，无法当场作出决定。A 选项药品行 政许可的申请主体包括企业法人、医疗机构、科研机构、自然人；B 选项根据《行政许可法》， 行政机关受理或不予受理许可申请，必须出具加盖专用印章和注明日期的书面凭证；C 选项形 式审查仅核查申请材料完整性、格式合规性，而药品领域许可需核查实际条件，均为实质审查。","chapter":"","groupId":null},{"type":"A","num":18,"stem":"承担药品质量标准、技术规范的制修订以及技术复核工作的机构是（）","groupStem":null,"options":["国家药品监督管理局药品评价中心","国家药典委员会","国家药品监督管理局药品审评中心","中国食品药品检定研究院"],"answer":"D","explanation":"中国食品药品检定研究院（中检院）是国家法定药品检验机构，承担药品质量标准、 技术规范的制修订，同时负责药品注册检验中的技术复核工作（如标准复核）。A 选项国家药 品监督管理局药品评价中心主要负责药品不良反应监测、非处方药适宜性审查、药品再评价等； B 选项国家药典委员会主要负责组织编纂《中国药典》、制定国家药品标准，但不承担\"技术 复核\"工作；C 选项药品审评中心主要负责药品注册审评。","chapter":"","groupId":null},{"type":"A","num":19,"stem":"关于医疗机构处方管理的说法，正确的是（）","groupStem":null,"options":["西药与中药注射剂可以合并开具处方，每一种药品应当另起一行，每张处方不得超过 5 种药 品","医疗机构审核和调配处方的药剂人员只能是依法经过资格认定的药师","对有配伍禁忌或者超剂量的处方，药师应当拒绝调配；必要时，经处方医师更正或者重新签 字，方可调配","医疗机构麻醉药品、精神药品、医疗用毒性药品处方保存期限为 2 年"],"answer":"C","explanation":"根据《处方管理办法》，药师发现处方有配伍禁忌或超剂量时，必须拒绝调配；经处 方医师更正或重新签字确认后，方可调配。A 选项西药与中药注射剂属于不同类别注射剂，应 当分别开具处方，不得合并开具；B 选项医疗机构审核、调配处方的人员，可为\"依法经过资 格认定的药师或其他药学技术人员\"，并非\"只能是药师\"；D 选项麻醉药品、第一类精神药品 处方保存期限为 3 年，第二类精神药品、医疗用毒性药品处方保存期限为 2 年。","chapter":"","groupId":null},{"type":"A","num":20,"stem":"下列属于《药品生产许可证》许可事项的是（）","groupStem":null,"options":["法定代表人","住所（经营场所）","生产地址","企业名称"],"answer":"C","explanation":"生产地址直接影响药品生产条件，属于\"许可事项\"，变更时需经发证机关审批。A 选 项法定代表人属于《药品生产许可证》的\"登记事项\"，变更时需向发证机关备案，而非许可事 项；B 选项住所（经营场所）属于\"登记事项\"，变更时按登记程序办理，无需审批；D 选项企 业名称与营业执照一致，属于\"登记事项\"，变更时同步更新许可证，无需单独审批。","chapter":"","groupId":null},{"type":"A","num":21,"stem":"关于医疗器械网络销售管理的说法，错误的是（）","groupStem":null,"options":["从事医疗器械网络销售的，应当向所在地市级药品监督管理部门备案","从事医疗器械网络销售的，可以是医疗器械注册人","从事医疗器械网络销售的，应当在其主页面显著位置展示其相关资质","从事医疗器械网络销售的，产品页面应当展示该产品的相关信息"],"answer":"A","explanation":"根据《医疗器械网络销售监督管理办法》，从事医疗器械网络销售的企业，应当向所 在地省级药品监督管理部门备案（第三方平台也需省级备案），并非\"市级\"。B 选项医疗器械 注册人、备案人可自行开展网络销售，符合\"谁注册、谁负责\"原则；C 选项网络销售页面需显 著展示营业执照、医疗器械经营/生产许可证等资质，接受公众监督；D 选项产品页面需展示 医疗器械注册证/备案凭证、说明书等信息，确保消费者知晓产品合规性。","chapter":"","groupId":null},{"type":"A","num":22,"stem":"关于血液制品管理的说法，正确的是（）","groupStem":null,"options":["从事血液制品生产活动须经国务院药品监督管理部门审批","开办全国性血液制品经营企业须经国务院药品监督管理部门审批","血液制品生产单位不得向其他任何单位供应原料血浆","生产国内已有的血液制品必须向省级药品监督管理部门备案"],"answer":"C","explanation":"原料血浆只能由血液制品生产单位自行采集，或从经批准的单采血浆站获取，不得向 其他单位供应。A 选项血液制品生产企业的审批权限为\"省级药品监督管理部门\"，并非\"国务 院药品监督管理部门\"；B 选项血液制品经营企业（含全国性）均由\"省级药品监督管理部门\" 审批；D 选项生产国内已有的血液制品，需按药品注册程序向\"国家药品监督管理部门\"申请上 市许可，而非\"省级备案\"。","chapter":"","groupId":null},{"type":"A","num":23,"stem":"关于药品经营行为的说法，正确的是（）","groupStem":null,"options":["药品零售企业销售第二类精神药品的处方至少保存 2 年备查","药品零售企业不得经营毒性中药饮片","药品零售企业不得经营蛋白同化制剂","药品零售企业不得经营罂粟壳中药饮片"],"answer":"D","explanation":"罂粟壳属于特殊管理中药饮片，药品零售企业（含连锁门店）一律不得经营。A 选项 药品零售企业销售第二类精神药品的处方，保存期限为\"至少 3 年\"，而非 2 年；B 选项药品零 售企业经批准可经营毒性中药饮片（需在经营范围中标注\"中药饮片（含毒性中药饮片）\"）， 并非\"不得经营\"；C 选项蛋白同化制剂中，胰岛素可由药品零售企业经营（需配备执业药师）， 并非所有蛋白同化制剂均不得经营。","chapter":"","groupId":null},{"type":"A","num":24,"stem":"根据《进口药材管理办法》，不能作为药材进口单位（中国境内）的是（）","groupStem":null,"options":["中成药上市许可持有人","中药生产企业","中医专科医院","具有中药饮片经营范围的药品经营企业"],"answer":"C","explanation":"中医专科医院的核心职能是提供医疗服务，无药材进口及经营资质，仅可从具备资质 的药品经营企业采购药材，不能作为药材进口单位。A 选项中成药上市许可持有人需进口药材 用于中成药生产，符合《进口药材管理办法》中\"药材进口单位\"的资格要求，可作为进口单位； B 选项中药生产企业为满足生产需求，可依法进口药材，属于法定药材进口单位范畴；D 选项 具有中药饮片经营范围的药品经营企业可通过正规渠道进口药材用于销售，符合进口单位资格 要求。","chapter":"","groupId":null},{"type":"A","num":25,"stem":"关于零售含麻黄碱类复方制剂管理要求的说法，正确的是（）","groupStem":null,"options":["销售含麻黄碱类复方制剂的处方药时，无需专门登记购买者的身份证信息","药品零售企业可以开架销售含麻黄碱类复方制剂的非处方药","可以通过网络零售含麻黄碱类复方制剂的非处方药","无处方销售含麻黄碱类复方制剂的非处方药时，一次销售不得超过 2 个最小包装"],"answer":"D","explanation":"无处方销售含麻黄碱类复方制剂的非处方药时，需严格控制销量，一次销售不得超过 2 个最小包装，符合防止滥用的管理要求。A 选项含麻黄碱类复方制剂属于国家有专门管理要 求的药品，销售处方药时必须登记购买者身份证信息，防止滥用；B 选项含麻黄碱类复方制剂 的非处方药需专柜管理、专人负责，不得开架自选销售；C 选项根据《药品网络销售监督管理 办法》及特殊药品管理规定，含麻黄碱类复方制剂（含非处方药）禁止通过网络零售。","chapter":"","groupId":null},{"type":"A","num":26,"stem":"关于药品安全与风险管理的说法，错误的是（）","groupStem":null,"options":["药品上市许可持有人应当对已上市药品的安全性、有效性和质量可控性定期开展上市后评价","药品上市前的风险管理主要包括非临床研究的风险管理和临床试验的风险管理","安全的药品是人们认为它对人体损害的风险程度在可接受水平，是一种\"可接受\"的有临床疗 效的药品","药品安全风险管理原则是全球药品管理的第一原则，目的在于使药品安全零风险，从而保障 公众用药安全"],"answer":"D","explanation":"药品安全风险管理的目的是将药品风险最小化，而非\"实现零风险\"（受限于医学认知 和药品特性，零风险无法实现）。A 选项根据《药品管理法》，药品上市许可持有人作为药品 质量第一责任人，需定期开展已上市药品的上市后评价，持续监测安全性、有效性和质量可控 性；B 选项药品上市前风险管理贯穿研制全流程，核心包括非临床研究阶段和临床试验阶段的 风险管控；C 选项药品安全具有相对性，不存在\"绝对安全\"，安全的药品是指其风险程度在公 众可接受范围内，且具备临床疗效。","chapter":"","groupId":null},{"type":"A","num":27,"stem":"根据《药品管理法》，提供虚假的证明、数据、资料、样品或者采取其他手段骗取药品许 可的，撤销相关许可，（）内不受理其相应申请，并处罚款。","groupStem":null,"options":["3 年","20 年","5 年","10 年"],"answer":"D","explanation":"根据《药品管理法》第一百二十三条规定，提供虚假证明、数据、资料、样品或者采 取其他手段骗取药品批准证明文件等许可的，撤销相关许可，10 年内不受理其相应申请，并 处五十万元以上五百万元以下罚款；情节严重的，对法定代表人、主要负责人、直接负责的主 管人员和其他责任人员，处十年直至终身禁止从事药品生产经营活动。A 选项（3 年）、C 选 项（5 年）为一般违规行为的处罚期限，B 选项（20 年）无对应法律规定。","chapter":"","groupId":null},{"type":"A","num":28,"stem":"关于中药管理的说法，错误的是（）","groupStem":null,"options":["中成药通用名称应科学、明确、简短、不易产生歧义和误导","古代经典名方复方制剂的药品名称原则上应当与古代医籍中的方剂名称相同","医疗机构配制的中药制剂可以在市场上销售","受中药品种保护的药品必须是列入国家药品标准的品种"],"answer":"C","explanation":"《药品管理法》明确规定，医疗机构配制的中药制剂（含传统工艺备案类）不得在市 场上销售或变相销售，仅可在本医疗机构内凭处方使用。A 选项根据《中成药通用名称命名技 术指导原则》，中成药通用名称需遵循\"科学、明确、简短、不易产生歧义和误导\"原则；B 选 项古代经典名方复方制剂的命名需尊重传统，原则上与古代医籍中的方剂名称一致；D 选项《中 药品种保护条例》要求，申请中药品种保护的药品必须是已列入国家药品标准的品种。","chapter":"","groupId":null},{"type":"A","num":29,"stem":"医疗机构遴选和新引进抗菌药物品种，应当由（）提交申请报告。","groupStem":null,"options":["药学部门","抗菌药物管理工作组","临床科室","药事管理与药物治疗学委员会"],"answer":"C","explanation":"根据《抗菌药物临床应用管理办法》，医疗机构遴选和新引进抗菌药物品种，需由临 床科室根据临床需求提交申请报告，经药学部门审核后，报抗菌药物管理工作组审议，最终由 药事管理与药物治疗学委员会批准，形成闭环管理。A 选项药学部门负责审核，B 选项抗菌药 物管理工作组负责审议，D 选项药事管理与药物治疗学委员会负责批准。","chapter":"","groupId":null},{"type":"A","num":30,"stem":"根据《中药品种保护条例》，下列可以申请中药一级保护品种的是（）","groupStem":null,"options":["申请专利的中药品种","从天然药物中提取的有效物质及特殊制剂","对特定疾病有特殊疗效的中药品种","对特定疾病有显著疗效的中药品种"],"answer":"C","explanation":"《中药品种保护条例》规定，中药一级保护品种的申请条件包括：①对特定疾病有特 殊疗效的；②相当于国家一级保护野生药材物种的人工制成品；③用于预防和治疗特殊疾病的。 A 选项申请专利的中药品种，自专利申请日起保护期内，暂不受理中药品种保护申请；B 选项\" 从天然药物中提取的有效物质及特殊制剂\"、D 选项\"对特定疾病有显著疗效的中药品种\"属于 中药二级保护品种的申请条件。","chapter":"","groupId":null},{"type":"A","num":31,"stem":"建设健康中国的根本目的是（）","groupStem":null,"options":["共建共享","全面保障","全民健康","科学发展"],"answer":"C","explanation":"《\"健康中国 2030\"规划纲要》明确指出，建设健康中国的战略主题是\"共建共享、全 民健康\"，其中\"全民健康\"是根本目的，\"共建共享\"是实现路径。A 选项共建共享为实现路径， B 选项全面保障、D 选项科学发展为健康中国建设的基本原则，均不符合\"根本目的\"定位。","chapter":"","groupId":null},{"type":"A","num":32,"stem":"关于药品经营企业收货和验收的说法，正确的是（）","groupStem":null,"options":["实施批签发管理的生物制品，药品批发企业验收时不得打开最小包装","到货药品未使用封闭式运输工具运输的，药品批发企业应当拒绝收货","外包装及封签完整的原料药，药品批发企业验收时不得开箱检查","药品零售连锁总部对到货药品应当按到货时间顺序抽样验收，抽样应当具有代表性"],"answer":"B","explanation":"根据《药品经营质量管理规范》，药品运输需使用封闭式工具（防止污染、丢失）， 未使用封闭式运输工具的，批发企业应当拒收。A 选项实施批签发管理的生物制品，验收时\" 可不开箱检查\"（非\"不得打开最小包装\"），若外包装破损或有质量疑问，仍需开箱核查；C 选项外包装及封签完整的原料药，验收时\"可不开箱检查\"（非\"不得开箱检查\"），若有质量疑 问或监管要求，仍需开箱检验；D 选项药品零售连锁总部验收药品需\"逐批抽样\"（非\"按到货 时间顺序\"），抽样需具有代表性。","chapter":"","groupId":null},{"type":"A","num":33,"stem":"关于药品上市许可持有人销售药品的说法，正确的是（）","groupStem":null,"options":["可以向中药饮片生产企业销售其持有的药品","可以委托药品批发企业销售其持有的药品","可以销售其持有品种以外的药品","不得直接向药品零售企业销售药品"],"answer":"B","explanation":"根据《药品管理法》，持有人可委托符合条件的药品批发企业销售其持有药品，需签 订委托协议明确质量责任。A 选项持有人销售药品需审核购货单位资质，中药饮片生产企业的 经营范围为\"中药饮片生产\"，无药品采购资质，持有人不得向其销售成品药品；C 选项持有人 仅可销售其取得药品注册证书的品种，不得销售\"持有品种以外的药品\"；D 选项持有人可直接 向药品零售企业销售药品（需审核零售企业资质），也可通过批发企业分销。","chapter":"","groupId":null},{"type":"A","num":34,"stem":"甲是药品批发企业，经营范围含有体外诊断试剂（药品），同时承担疫苗储存配送业务。 根据《药品经营质量管理规范现场检查指导原则（2016 年版）》，检查中甲可能涉及的严重 缺陷项目最多有（）","groupStem":null,"options":["8 项","10 项","12 项","11 项"],"answer":"D","explanation":"根据《药品经营质量管理规范现场检查指导原则（2016 年版）》，药品批发企业基 础严重缺陷项目共 10 项，涵盖质量管理体系、人员资质、计算机系统、冷链管理等核心环节。 甲企业额外承担\"疫苗储存配送业务\"，需增加 1 项针对疫苗储存配送的严重缺陷项目（如疫苗 冷库双回路供电、备用发电机组等特殊要求），因此总严重缺陷项目最多为 10+1=11 项。A 选 项 8 项、B 选项 10 项未包含疫苗专项要求，C 选项 12 项无对应标准。","chapter":"","groupId":null},{"type":"A","num":35,"stem":"药品零售企业申请医疗保障定点的，应当在法定经营地址正式经营的时间不少于（）","groupStem":null,"options":["3 个月","1 个月","12 个月","6 个月"],"answer":"A","explanation":"根据《零售药店医疗保障定点管理暂行办法》，申请医保定点的零售药店需满足\"在 注册地址正式经营至少 3 个月\"的条件，这是确保药店具备稳定经营能力和服务水平的基础要 求。B 选项 1 个月、D 选项 6 个月、C 选项 12 个月均不符合医保定点申请的法定经营时长要求。","chapter":"","groupId":null},{"type":"A","num":36,"stem":"执业药师注册的有效期是（）","groupStem":null,"options":["5 年","4 年","3 年","2 年"],"answer":"A","explanation":"根据《执业药师注册管理办法》，执业药师注册有效期为 5 年。需要延续注册的，申 请人应在注册有效期满前 30 日内，向执业所在地省级药品监督管理部门提出申请，符合要求 的可延续 5 年注册有效期。B 选项 4 年、C 选项 3 年（旧版规定有效期）、D 选项 2 年均与现 行注册管理办法不符。","chapter":"","groupId":null},{"type":"A","num":37,"stem":"《药品管理法》属于（）","groupStem":null,"options":["行政法规","部门规章","基本法律以外的其他法律","基本法律"],"answer":"C","explanation":"我国法律分为\"基本法律\"（由全国人民代表大会制定，如《刑法》《民法典》）和\" 基本法律以外的其他法律\"（由全国人民代表大会常务委员会制定）。《药品管理法》由全国 人大常委会制定并修订，属于基本法律以外的其他法律。A 选项行政法规（如《药品管理法实 施条例》）、B 选项部门规章（如《药品注册管理办法》）、D 选项基本法律均不符合《药品 管理法》的法律层级。","chapter":"","groupId":null},{"type":"A","num":38,"stem":"下列属于国务院药品监督管理部门职责的是（）","groupStem":null,"options":["承担中药安全监督管理工作","组织开展中药资源普查","组织制定药品价格政策","承担国家药品储备管理工作"],"answer":"A","explanation":"国务院药品监督管理部门（国家药监局）主管全国药品监督管理工作，包括中药安全 监督管理（如中药注册、生产经营监管），属于其核心职责。B 选项组织开展中药资源普查是 国家中医药管理局的职责；C 选项组织制定药品价格政策是国家医疗保障局的职责；D 选项承 担国家药品储备管理工作是工业和信息化部门的职责。","chapter":"","groupId":null},{"type":"A","num":39,"stem":"根据临床急需药品临时进口相关规定，医疗机构申请临床急需麻醉药品进口准许证，符合 规定的，国家药品监督管理局在收到申请后（）个工作日内出具进口准许证","groupStem":null,"options":["10","3","7","5"],"answer":"B","explanation":"针对临床急需麻醉药品的进口审批，国家药品监督管理局实行加急办理机制，符合规 定的，自收到申请后 3 个工作日内出具进口准许证，以保障临床紧急用药需求。A 选项 10 个 工作日（普通药品审批时限）、C 选项 7 个工作日、D 选项 5 个工作日均不符合临床急需麻醉 药品的加急审批时限要求。","chapter":"","groupId":null},{"type":"A","num":40,"stem":"下列不属于药品网络交易第三方平台应当建立并实施的管理制度是（）","groupStem":null,"options":["药品信息展示管理制度","药品配送管理制度","药品回收管理制度","投诉举报处理管理制度"],"answer":"C","explanation":"根据《药品网络销售监督管理办法》，第三方平台必须建立并实施的核心管理制度包 括：A 选项药品信息展示管理制度（需规范平台内药品信息的展示形式，如处方药与非处方药 区分展示等）；B 选项药品配送管理制度（需对入驻企业的药品配送环节进行管理，如冷藏药 品温控、配送记录留存等）；D 选项投诉举报处理管理制度（需建立专门机制接收、处理消费 者投诉举报）。C 选项药品回收管理制度，法规中未要求第三方平台建立药品回收相关制度（药 品回收通常由药品上市许可持有人、药品经营企业按《药品召回管理办法》等规定执行），因 此该制度不属于第三方平台的法定必备管理制度。","chapter":"","groupId":null},{"type":"B","num":41,"stem":"对药品上市许可持有人执行药品经营质量管理规范情况开展的检查属于（）","groupStem":"A.常规检查　　B.有因检查　　C.许可检查　　D.其他检查","options":["常规检查","有因检查","许可检查","其他检查"],"answer":"A","explanation":"根据《药品检查管理办法（试行）》，常规检查是药品监督管理部门依据年度检查计 划，对药品上市许可持有人、生产企业等\"遵守法律法规、执行质量管理规范\"开展的常态化检 查，重点是持续合规性监督，与题干中\"执行药品经营质量管理规范情况\"的检查目的完全匹配， 故为常规检查。","chapter":"","groupId":"B1"},{"type":"B","num":42,"stem":"对药品上市许可持有人的申报资料真实性有疑问，开展的针对性检查属于（）","groupStem":"A.常规检查　　B.有因检查　　C.许可检查　　D.其他检查","options":["常规检查","有因检查","许可检查","其他检查"],"answer":"B","explanation":"有因检查是针对\"具体问题或投诉举报\"开展的针对性检查，题干中\"对申报资料真实 性有疑问\"属于明确的风险线索，需通过有因检查核实情况，符合有因检查\"针对性\"的核心特 征，故为有因检查。","chapter":"","groupId":"B1"},{"type":"B","num":43,"stem":"属于处方适宜性审核的内容是（）","groupStem":"A.麻醉药品处方是否由具有相应处方权的医师开具　　B.处方前记、正文和后记是否符合《处方管理办法》等有关规定　　C.西药及中成药处方是否有重复用药和相互作用情况　　D.药品剂量、规格、用法、用量是否准确清晰","options":["麻醉药品处方是否由具有相应处方权的医师开具","处方前记、正文和后记是否符合《处方管理办法》等有关规定","西药及中成药处方是否有重复用药和相互作用情况","药品剂量、规格、用法、用量是否准确清晰"],"answer":"C","explanation":"处方适宜性审核聚焦\"用药合理性\"，核心是判断用药方案是否科学（如是否重复用药、 是否存在配伍禁忌或不良相互作用），题干中\"重复用药和相互作用\"直接关联用药适宜性，故 属于适宜性审核内容。","chapter":"","groupId":"B2"},{"type":"B","num":44,"stem":"属于处方合法性审核的内容是（）","groupStem":"A.麻醉药品处方是否由具有相应处方权的医师开具　　B.处方前记、正文和后记是否符合《处方管理办法》等有关规定　　C.西药及中成药处方是否有重复用药和相互作用情况　　D.药品剂量、规格、用法、用量是否准确清晰","options":["麻醉药品处方是否由具有相应处方权的医师开具","处方前记、正文和后记是否符合《处方管理办法》等有关规定","西药及中成药处方是否有重复用药和相互作用情况","药品剂量、规格、用法、用量是否准确清晰"],"answer":"A","explanation":"处方合法性审核聚焦\"开具流程合规性\"，重点核查处方开具主体、权限、格式等是否 符合法律规定。麻醉药品属于特殊管理药品，需由具备专门处方权的医师开具，题干中\"是否 由相应处方权医师开具\"属于权限合法性核查，故为合法性审核内容。","chapter":"","groupId":"B2"},{"type":"B","num":45,"stem":"药品监督管理部门对药品网络交易第三方平台监督检查时，发现入驻该平台的某零售企业 无《药品经营许可证》，应当认定该平台为（）","groupStem":"A.未按照规定进行资质审核　　B.未按照规定履行监督义务　　C.未按照规定履行配合召回义务","options":["未按照规定进行资质审核","未按照规定履行监督义务","未按照规定履行配合召回义务"],"answer":"B","explanation":"根据《药品网络销售监督管理办法》，药品网络交易第三方平台的核心义务之一是\" 入驻企业资质审核\"，需核验并留存入驻药品零售企业的《药品经营许可证》等合法资质，确 保入驻主体合规。题干中平台允许\"无《药品经营许可证》的零售企业\"入驻，属于未履行资质 审核义务，故应当认定该平台为未按照规定进行资质审核。","chapter":"","groupId":"B3"},{"type":"B","num":46,"stem":"药品上市许可持有人甲发起某药品（未赋码）召回，药品经营企业乙按照要求退回该药品， 但未反馈药品召回信息。药品监督管理部门对乙应当认定为（）","groupStem":"A.未按照规定进行资质审核　　B.未按照规定履行监督义务　　C.未按照规定履行配合召回义务","options":["未按照规定进行资质审核","未按照规定履行监督义务","未按照规定履行配合召回义务"],"answer":"D","explanation":"依据《药品召回管理办法》，药品经营企业在药品召回中的义务包括\"按照持有人要 求退回药品\"和\"及时反馈召回进展、药品数量等信息\"，二者均属于配合召回的核心内容。题 干中企业乙虽退回药品，但\"未反馈召回信息\"，仍未完整履行配合义务，故药品监督管理部门 对乙应当认定为未按照规定履行配合召回义务。","chapter":"","groupId":"B3"},{"type":"B","num":47,"stem":"属于国家重点保护野生药材的是（）","groupStem":"A.斑蝥　　B.羚羊角　　C.西洋参　　D.麻黄","options":["斑蝥","羚羊角","西洋参","麻黄"],"answer":"B","explanation":"根据《国家重点保护野生药材物种名录》，羚羊角来源于国家一级保护野生动物赛加 羚羊，属于国家一级重点保护野生药材，其采猎、使用、经营均受严格管控，符合\"国家重点 保护野生药材\"的定义。","chapter":"","groupId":"B4"},{"type":"B","num":48,"stem":"属于按照传统既是食品又是中药材的是（）","groupStem":"A.斑蝥　　B.羚羊角　　C.西洋参　　D.麻黄","options":["斑蝥","羚羊角","西洋参","麻黄"],"answer":"C","explanation":"依据《按照传统既是食品又是中药材的物质目录》，西洋参是经国家卫健委、国家药 监局认定的\"药食同源\"品种，可在限定范围内作为食品原料使用（如用于保健食品、普通食品）， 同时也具备中药材药用价值，符合\"传统既是食品又是中药材\"的范畴。","chapter":"","groupId":"B4"},{"type":"B","num":49,"stem":"属于医疗用毒性药品的是（）","groupStem":"A.斑蝥　　B.羚羊角　　C.西洋参　　D.麻黄","options":["斑蝥","羚羊角","西洋参","麻黄"],"answer":"A","explanation":"根据《医疗用毒性药品管理办法》及配套目录，斑蝥含有斑蝥素等毒性成分，对人体 有明确毒性，属于毒性中药品种，其生产、经营、使用需严格遵守毒性药品管理规定（如定点 生产、双人双锁储存、限量供应），符合\"医疗用毒性药品\"的定义。","chapter":"","groupId":"B4"},{"type":"B","num":50,"stem":"负责制定本医疗机构药品处方集和基本用药供应目录的是（）","groupStem":"A.药事管理与药物治疗学委员会　　B.药学部门　　C.药品质量管理部门　　D.医务部门","options":["药事管理与药物治疗学委员会","药学部门","药品质量管理部门","医务部门"],"answer":"A","explanation":"根据《医疗机构药事管理规定》，药事管理与药物治疗学委员会是医疗机构药事管理 的决策机构，核心职责包括\"制定本机构药品处方集和基本用药供应目录\"，统筹规范临床用药 品种，确保用药合理、合规，与题干职责完全匹配。","chapter":"","groupId":"B5"},{"type":"B","num":51,"stem":"负责医疗机构临床使用药品的采购和供应保障工作的是（）","groupStem":"A.药事管理与药物治疗学委员会　　B.药学部门　　C.药品质量管理部门　　D.医务部门","options":["药事管理与药物治疗学委员会","药学部门","药品质量管理部门","医务部门"],"answer":"B","explanation":"药学部门是医疗机构具体负责药品管理的执行部门，承担\"药品采购、储存、调配、 供应\"等日常工作，直接保障临床用药的及时性和安全性，题干中\"采购和供应保障工作\"属于 药学部门的核心职能。","chapter":"","groupId":"B5"},{"type":"B","num":52,"stem":"只能在医疗机构调剂使用的是（）","groupStem":"A.中药材初加工产品　　B.中药饮片　　C.中药配方颗粒　　D.中成药颗粒剂","options":["中药材初加工产品","中药饮片","中药配方颗粒","中成药颗粒剂"],"answer":"C","explanation":"根据《中药配方颗粒管理办法》，中药配方颗粒实行\"定点生产、定点销售\"管理，仅 限在医疗机构内凭处方调剂使用，不得在药品零售企业销售，也不得作为普通食品或保健食品 原料，符合\"只能在医疗机构调剂使用\"的要求。","chapter":"","groupId":"B6"},{"type":"B","num":53,"stem":"既可根据处方在药品零售企业销售，也可作为中成药生产原料的是（）","groupStem":"A.中药材初加工产品　　B.中药饮片　　C.中药配方颗粒　　D.中成药颗粒剂","options":["中药材初加工产品","中药饮片","中药配方颗粒","中成药颗粒剂"],"answer":"B","explanation":"中药饮片兼具\"零售\"和\"生产原料\"双重属性：一方面，药品零售企业可凭处方销售中 药饮片（需配备中药学专业技术人员）；另一方面，中药饮片是中成药生产的核心原料（如中 成药生产企业采购中药饮片进行提取、炮制后制成中成药），完全匹配题干描述。","chapter":"","groupId":"B6"},{"type":"B","num":54,"stem":"北京市某非法人药品批发企业的药品经营许可证编号可能是（）","groupStem":"A.京 CA0100000XX　　B.京 AB0100000XX　　C.京 BA01000000X　　D.京 DB010000XXX　　E.根据《药品经营和使用质量监督管理办法》","options":["京 CA0100000XX","京 AB0100000XX","京 BA01000000X","京 DB010000XXX","根据《药品经营和使用质量监督管理办法》"],"answer":"B","explanation":"根据《药品经营和使用质量监督管理办法》，药品经营许可证编号格式为\"省份简称+ 两位分类代码+四位地区代码+五位顺序号\"。非法人药品批发企业需满足：第一位代码\"A\"（批 发）+第二位代码\"B\"（非法人）+地区代码\"0100\"，编号\"京 AB0100000XX\"完全匹配。","chapter":"","groupId":"B7"},{"type":"B","num":55,"stem":"北京市某非法人单体药品零售企业的药品经营许可证编号可能是（）","groupStem":"A.京 CA0100000XX　　B.京 AB0100000XX　　C.京 BA01000000X　　D.京 DB010000XXX　　E.根据《药品经营和使用质量监督管理办法》","options":["京 CA0100000XX","京 AB0100000XX","京 BA01000000X","京 DB010000XXX","根据《药品经营和使用质量监督管理办法》"],"answer":"D","explanation":"非法人单体药品零售企业需满足：第一位代码\"D\"（单体零售）+第二位代码\"B\"（非 法人）+地区代码\"0100\"，编号\"京 DB010000XXX\"符合规则。编码规则：第一位分类代码（A= 批发企业，B=药品零售连锁总部，C=零售连锁门店，D=单体药品零售企业），第二位分类代码 （A=法人企业，B=非法人企业）。","chapter":"","groupId":"B7"},{"type":"B","num":56,"stem":"北京市某法人药品零售连锁总部的药品经营许可证编号可能是（）","groupStem":"A.京 CA0100000XX　　B.京 AB0100000XX　　C.京 BA01000000X　　D.京 DB010000XXX　　E.根据《药品经营和使用质量监督管理办法》","options":["京 CA0100000XX","京 AB0100000XX","京 BA01000000X","京 DB010000XXX","根据《药品经营和使用质量监督管理办法》"],"answer":"C","explanation":"法人药品零售连锁总部需满足：第一位代码\"B\"（零售连锁总部）+第二位代码\"A\"（法 人）+地区代码\"0100\"，编号\"京 BA01000000X\"符合规则。北京市对应地区代码为\"0100\"（基 于国内电话区号\"010\"调整）。","chapter":"","groupId":"B7"},{"type":"B","num":57,"stem":"国家医保谈判药品临床合理使用的第一责任人是（）","groupStem":"A.疾病预防控制机构　　B.药品经营企业　　C.医疗机构　　D.药品上市许可持有人","options":["疾病预防控制机构","药品经营企业","医疗机构","药品上市许可持有人"],"answer":"C","explanation":"根据国家医保谈判药品临床使用管理要求，医疗机构是医保谈判药品临床使用的\"第 一责任人\"，需通过制定用药规范、开展处方审核、加强临床监测等措施，确保谈判药品合理 使用，保障患者用药安全且医保基金高效利用。","chapter":"","groupId":"B8"},{"type":"B","num":58,"stem":"药物警戒的责任主体是（）","groupStem":"A.疾病预防控制机构　　B.药品经营企业　　C.医疗机构　　D.药品上市许可持有人","options":["疾病预防控制机构","药品经营企业","医疗机构","药品上市许可持有人"],"answer":"D","explanation":"《药品管理法》及《药物警戒质量管理规范》明确规定，药品上市许可持有人是药物 警戒的责任主体，需建立药物警戒体系，主动开展不良反应监测、风险识别与控制，对药品全 生命周期的安全性负责。A 选项疾病预防控制机构侧重疫苗接种、传染病防控；B 选项药品经 营企业协助开展药物警戒信息收集，非责任主体。","chapter":"","groupId":"B8"},{"type":"B","num":59,"stem":"属于药品类易制毒化学品的是（）","groupStem":"A.消旋麻黄素　　B.艾司唑仑　　C.福尔可定　　D.丁丙诺啡","options":["消旋麻黄素","艾司唑仑","福尔可定","丁丙诺啡"],"answer":"A","explanation":"根据《易制毒化学品管理条例》及药品类易制毒化学品目录，消旋麻黄素（麻黄碱类 物质）是制造毒品的关键原料，属于药品类易制毒化学品，其生产、经营、购买、运输均需严 格审批，故属于药品类易制毒化学品。","chapter":"","groupId":"B9"},{"type":"B","num":60,"stem":"属于第二类精神药品的是（）","groupStem":"A.消旋麻黄素　　B.艾司唑仑　　C.福尔可定　　D.丁丙诺啡","options":["消旋麻黄素","艾司唑仑","福尔可定","丁丙诺啡"],"answer":"B","explanation":"艾司唑仑属于苯二氮䓬类镇静催眠药，根据《麻醉药品和精神药品品种目录》，其具 有一定成瘾性，被列为第二类精神药品，需凭处方购买且严格控制用量，故属于第二类精神药 品。","chapter":"","groupId":"B9"},{"type":"B","num":61,"stem":"属于第一类精神药品的是（）","groupStem":"A.消旋麻黄素　　B.艾司唑仑　　C.福尔可定　　D.丁丙诺啡","options":["消旋麻黄素","艾司唑仑","福尔可定","丁丙诺啡"],"answer":"D","explanation":"第一类精神药品品种 (1)哌醋甲酯 (2)司可巴比妥 (3)丁丙诺啡 (4)γ-羟丁酸 (5)氯胺酮 (6)马吲哚 (7)三唑仑 (8)咪达唑仑原料药和注射剂 (9)口服固体制剂每剂量单位含羟考酮碱大于 5 毫克，且不含其他麻醉药品、精神药品或药品 类易制毒化学品的复方制剂 (10)每剂量单位含氢可酮碱大于 5 毫克，且不含其他麻醉药品、精神药品或药品类易制毒化学 品的复方口服固体制剂","chapter":"","groupId":"B9"},{"type":"B","num":62,"stem":"对参保职工发生的符合规定的高额医疗费用给予进一步保障的职工大额医疗费用补助属于 （）","groupStem":"A.基本医疗保险　　B.补充医疗保险　　C.医疗救助　　D.商业健康保险","options":["基本医疗保险","补充医疗保险","医疗救助","商业健康保险"],"answer":"B","explanation":"补充医疗保险是在基本医疗保险基础上，对参保人高额医疗费用进行额外保障的制度 （如职工大额医疗费用补助、企业补充医疗保险），旨在减轻基本医保报销后的个人负担，故 对参保职工发生的符合规定的高额医疗费用给予进一步保障的职工大额医疗费用补助属于补 充医疗保险。","chapter":"","groupId":"B10"},{"type":"B","num":63,"stem":"覆盖城乡全体人口，公平普惠保障人民群众基本医疗需求的是（）","groupStem":"A.基本医疗保险　　B.补充医疗保险　　C.医疗救助　　D.商业健康保险","options":["基本医疗保险","补充医疗保险","医疗救助","商业健康保险"],"answer":"A","explanation":"基本医疗保险（含职工医保、居民医保）是我国医疗保障体系的主体，遵循\"覆盖全 民、城乡统筹、权责清晰、保障适度\"原则，核心是公平普惠保障人民群众基本医疗需求，故 覆盖城乡全体人口，公平普惠保障人民群众基本医疗需求的是基本医疗保险。","chapter":"","groupId":"B10"},{"type":"B","num":64,"stem":"对细胞治疗类生物制品批发企业的监督检查频次为（）","groupStem":"A.在一个许可周期内检查不少于 1 次　　B.每年检查不少于 1 次　　C.每半年检查不少于 1 次　　D.每季度检查不少于 1 次","options":["在一个许可周期内检查不少于 1 次","每年检查不少于 1 次","每半年检查不少于 1 次","每季度检查不少于 1 次"],"answer":"B","explanation":"根据《药品经营和使用质量监督管理办法》，细胞治疗类生物制品属于高风险药品， 批发企业需每年至少检查 1 次，符合风险管控要求，故对细胞治疗类生物制品批发企业的监督 检查频次为每年检查不少于 1 次。","chapter":"","groupId":"B11"},{"type":"B","num":65,"stem":"对冷藏、冷冻药品经营企业的监督检查频次为（）","groupStem":"A.在一个许可周期内检查不少于 1 次　　B.每年检查不少于 1 次　　C.每半年检查不少于 1 次　　D.每季度检查不少于 1 次","options":["在一个许可周期内检查不少于 1 次","每年检查不少于 1 次","每半年检查不少于 1 次","每季度检查不少于 1 次"],"answer":"B","explanation":"根据《药品经营和使用质量监督管理办法》，冷藏、冷冻药品储存运输风险高，经营 企业需每年至少检查 1 次，确保冷链全程合规，故对冷藏、冷冻药品经营企业的监督检查频次 为每年检查不少于 1 次。","chapter":"","groupId":"B11"},{"type":"B","num":66,"stem":"对第一类精神药品全国性定点批发企业的监督检查频次为（）","groupStem":"A.在一个许可周期内检查不少于 1 次　　B.每年检查不少于 1 次　　C.每半年检查不少于 1 次　　D.每季度检查不少于 1 次","options":["在一个许可周期内检查不少于 1 次","每年检查不少于 1 次","每半年检查不少于 1 次","每季度检查不少于 1 次"],"answer":"C","explanation":"根据《药品经营和使用质量监督管理办法》，第一类精神药品属于极高风险药品，全 国性定点批发企业作为关键流通节点，需每半年至少检查 1 次，严防流入非法渠道，故对第一 类精神药品全国性定点批发企业的监督检查频次为每半年检查不少于 1 次。","chapter":"","groupId":"B11"},{"type":"B","num":67,"stem":"应当具有医疗机构执业许可证，并设置伦理委员会的是（）","groupStem":"A.药品上市许可持有人　　B.药品受托生产企业　　C.药物临床试验机构　　D.临床试验申请人","options":["药品上市许可持有人","药品受托生产企业","药物临床试验机构","临床试验申请人"],"answer":"C","explanation":"根据《药物临床试验机构管理规定》，药物临床试验机构需具备医疗机构执业许可证 （开展以患者为受试者的试验时，诊疗科目需与试验适应症一致），且必须设置伦理委员会， 负责审查试验方案的伦理合理性、保护受试者权益，故应当具有医疗机构执业许可证，并设置 伦理委员会的是药物临床试验机构。","chapter":"","groupId":"B12"},{"type":"B","num":68,"stem":"负责委托生产药品出厂放行的是（）","groupStem":"A.药品上市许可持有人　　B.药品受托生产企业　　C.药物临床试验机构　　D.临床试验申请人","options":["药品上市许可持有人","药品受托生产企业","药物临床试验机构","临床试验申请人"],"answer":"B","explanation":"依据《药品生产监督管理办法》及药品 GSP，受托生产企业对委托生产药品的生产过 程质量负责，需建立出厂放行规程，经质量受权人签字后放行药品，而上市许可持有人负责上 市放行，故负责委托生产药品出厂放行的是药品受托生产企业。","chapter":"","groupId":"B12"},{"type":"B","num":69,"stem":"对临床试验用药品质量承担责任的是（）","groupStem":"A.药品上市许可持有人　　B.药品受托生产企业　　C.药物临床试验机构　　D.临床试验申请人","options":["药品上市许可持有人","药品受托生产企业","药物临床试验机构","临床试验申请人"],"answer":"D","explanation":"根据《药物临床试验质量管理规范》，临床试验申请人（申办者）是临床试验用药品 质量的责任主体，需确保试验用药品的制备、储存、运输符合 GMP 及试验方案要求，对药品质 量承担直接责任，故对临床试验用药品质量承担责任的是临床试验申请人。","chapter":"","groupId":"B12"},{"type":"B","num":70,"stem":"为急诊癌症疼痛患者开具麻醉药品控缓释制剂，每张处方不得超过（）","groupStem":"A.7 日常用量　　B.15 日常用量　　C.4 周常用量　　D.12 周常用量","options":["7 日常用量","15 日常用量","4 周常用量","12 周常用量"],"answer":"B","explanation":"根据《处方管理办法》及特殊管理药品处方限量规定，急诊癌症疼痛患者开具麻醉药 品控缓释制剂，遵循\"麻醉药品控缓释制剂+癌症疼痛\"的核心限量规则，每张处方不得超过 15 日常用量，故为急诊癌症疼痛患者开具麻醉药品控缓释制剂，每张处方不得超过 15 日常用量。","chapter":"","groupId":"B13"},{"type":"B","num":71,"stem":"为门诊患者开具第二类精神药品，每张处方不得超过（）","groupStem":"A.7 日常用量　　B.15 日常用量　　C.4 周常用量　　D.12 周常用量","options":["7 日常用量","15 日常用量","4 周常用量","12 周常用量"],"answer":"A","explanation":"根据《处方管理办法》及特殊管理药品处方限量规定，第二类精神药品门诊患者处方 限量为 7 日常用量（普通剂型），无特殊说明时按常规限量执行，故为门诊患者开具第二类精 神药品，每张处方不得超过 7 日常用量。","chapter":"","groupId":"B13"},{"type":"B","num":72,"stem":"标示\"请仔细阅读说明书并在医师指导下使用\"的内容，应当列入（）","groupStem":"A.\"说明书标题\"标注　　B.【作用类别】　　C.【禁忌】　　D.【注意事项】","options":["\"说明书标题\"标注","【作用类别】","【禁忌】","【注意事项】"],"answer":"A","explanation":"根据《药品说明书和标签管理规定》及《化学药品和治疗用生物制品说明书规范细则》， 药品说明书标题下方必须统一标注警示语，其中\"请仔细阅读说明书并在医师指导下使用\"是处 方药说明书的法定必备警示语，需直接在说明书标题附近显著标示，故标示\"请仔细阅读说明 书并在医师指导下使用\"的内容，应当列入\"说明书标题\"标注。","chapter":"","groupId":"B14"},{"type":"B","num":73,"stem":"标示\"本品不可过量、长期使用\"的内容，应当列入（）","groupStem":"A.\"说明书标题\"标注　　B.【作用类别】　　C.【禁忌】　　D.【注意事项】","options":["\"说明书标题\"标注","【作用类别】","【禁忌】","【注意事项】"],"answer":"D","explanation":"【注意事项】主要载明药品使用中的特殊警示信息，包括用药剂量限制（如\"不可过 量\"）、用药时长要求（如\"不可长期使用\"）、特殊人群用药提示、药物相互作用风险等。\" 本品不可过量、长期使用\"属于用药安全限制类提示，故标示\"本品不可过量、长期使用\"的内 容，应当列入【注意事项】。","chapter":"","groupId":"B14"},{"type":"B","num":74,"stem":"标示\"解热镇痛类\"的内容，应当列入（）","groupStem":"A.\"说明书标题\"标注　　B.【作用类别】　　C.【禁忌】　　D.【注意事项】","options":["\"说明书标题\"标注","【作用类别】","【禁忌】","【注意事项】"],"answer":"B","explanation":"【作用类别】是药品说明书的基础分类信息，用于明确药品所属的治疗类别（如\"解 热镇痛类\"\"抗高血压类\"\"抗生素类\"），帮助使用者快速判断药品的治疗方向，\"解热镇痛类\" 完全符合该项目的内容定位，故标示\"解热镇痛类\"的内容，应当列入【作用类别】。","chapter":"","groupId":"B14"},{"type":"B","num":75,"stem":"药品批发企业对温湿度自动监测系统开展验证工作，验证数据采集的间隔时间不得大于（）","groupStem":"A.1 分钟　　B.2 分钟　　C.5 分钟　　D.30 分钟","options":["1 分钟","2 分钟","5 分钟","30 分钟"],"answer":"C","explanation":"根据《药品经营质量管理规范》及《药品经营质量管理规范附录 3（温湿度自动监测）》， 系统验证是确保监测准确性的关键环节，要求验证数据采集的间隔时间不得大于 5 分钟，以全 面覆盖温湿度变化情况，保证验证结果的可靠性，故药品批发企业对温湿度自动监测系统开展 验证工作，验证数据采集的间隔时间不得大于 5 分钟。","chapter":"","groupId":"B15"},{"type":"B","num":76,"stem":"药品批发企业配备的温湿度自动监测系统在时刻 A 记录到药品仓库阴凉储存作业区温度达 到 22℃，系统变频至每（）至少记录 1 次监测","groupStem":"A.1 分钟　　B.2 分钟　　C.5 分钟　　D.30 分钟","options":["1 分钟","2 分钟","5 分钟","30 分钟"],"answer":"B","explanation":"阴凉储存作业区的温度标准为\"不高于 20℃\"，当监测到温度达到 22℃（超出标准范 围）时，系统需自动进入\"变频监测\"模式，此时数据记录间隔需缩短至每 2 分钟至少 1 次，以 便实时跟踪温湿度异常变化，及时触发预警，故系统变频至每 2 分钟至少记录 1 次监测。","chapter":"","groupId":"B15"},{"type":"B","num":77,"stem":"药品批发企业配备的温湿度自动监测系统应当自动对药品储存过程中的温湿度进行不间断 监测和记录，测点温湿度数据每（）至少更新采集","groupStem":"A.1 分钟　　B.2 分钟　　C.5 分钟　　D.30 分钟","options":["1 分钟","2 分钟","5 分钟","30 分钟"],"answer":"A","explanation":"正常储存状态下，温湿度自动监测系统需对测点数据进行不间断采集，要求每 1 分钟 至少更新采集 1 次，确保数据的实时性和连续性，为药品储存环境的合规性提供完整记录，故 测点温湿度数据每 1 分钟至少更新采集。","chapter":"","groupId":"B15"},{"type":"B","num":78,"stem":"负责药品广告审查和监督处罚的部门是（）","groupStem":"A.市场监督管理部门　　B.工业和信息化部门　　C.卫生健康主管部门　　D.医疗保障主管部门","options":["市场监督管理部门","工业和信息化部门","卫生健康主管部门","医疗保障主管部门"],"answer":"A","explanation":"根据《药品广告审查办法》，省级市场监督管理部门负责药品广告批准文号的审查与 核发，同时各级市场监督管理部门对辖区内违法药品广告（如虚假宣传、超范围宣传）实施监 督检查与行政处罚，故负责药品广告审查和监督处罚的部门是市场监督管理部门。","chapter":"","groupId":"B16"},{"type":"B","num":79,"stem":"负责组织制定国家药物政策和国家基本药物制度的部门是（）","groupStem":"A.市场监督管理部门　　B.工业和信息化部门　　C.卫生健康主管部门　　D.医疗保障主管部门","options":["市场监督管理部门","工业和信息化部门","卫生健康主管部门","医疗保障主管部门"],"answer":"C","explanation":"卫生健康主管部门的核心职能之一是统筹药品临床使用与管理，具体包括组织制定国 家药物政策（如用药指南、合理用药规范）、牵头国家基本药物制度的建立与实施（如基本药 物遴选、配备使用管理），故负责组织制定国家药物政策和国家基本药物制度的部门是卫生健 康主管部门。","chapter":"","groupId":"B16"},{"type":"B","num":80,"stem":"负责制定药品招标采购政策的部门是（）","groupStem":"A.市场监督管理部门　　B.工业和信息化部门　　C.卫生健康主管部门　　D.医疗保障主管部门","options":["市场监督管理部门","工业和信息化部门","卫生健康主管部门","医疗保障主管部门"],"answer":"D","explanation":"医疗保障主管部门负责药品价格与采购管理，主要包括制定药品集中采购政策（如国 家组织药品集中带量采购规则）、规范医保药品招标采购流程、管理药品医保支付标准，故负 责制定药品招标采购政策的部门是医疗保障主管部门。","chapter":"","groupId":"B16"},{"type":"C","num":81,"stem":"2025 年 4 月，药品监督管理部门对甲进行检查，发现甲将货值金额 30 万元的中药饮片放 置于某物流仓库内（甲的《药品经营许可证》未载明该地址）。药品监督管理部门认为甲将中 药饮片储存于法定仓库地址之外，但鉴于储存场所基本符合《药品经营质量管理规范》要求， 依据相关规定决定从轻处罚，予以（）","groupStem":"甲是 M 省一家药品批发企业，《药品经营许可证》经营范围：中成药、化学药、中 药饮片、麻醉药品、医疗用毒性药品，有效期至 2028 年 12 月 31 日。乙是 N 省一家药品批发 企业，《药品经营许可证》经营范围：中成药、化学药，有效期至 2025 年 9 月 30 日。丙是 M 省一家社区卫生服务中心，诊疗范围：内科、中医科。","options":["罚款 450 万元，并要求其限期改正","责令其限期改正，但免于行政处罚","警告，并要求其限期改正","罚款 150 万元，并要求其限期改正"],"answer":"A","explanation":"根据《药品管理法》，药品经营企业擅自变更储存地址（许可证未载明）属于\"擅自 变更许可事项\"，货值金额 30 万元的，处货值金额 15-30 倍罚款（30 万×15 倍=450 万）。题 干中\"储存场所符合 GSP\"仅可作为从轻处罚的情节，但不得免于罚款，故 450 万元罚款并限期 改正是符合规定的处罚结果。","chapter":"","groupId":"C17"},{"type":"C","num":82,"stem":"乙在（）申请换发《药品经营许可证》，不会影响其许可证到期后继续经营药品","groupStem":"甲是 M 省一家药品批发企业，《药品经营许可证》经营范围：中成药   const found = list.find(w => w.key === bank.id + '_' + idx);
  if (found) { found.times++; found.last = Date.now(); }
  else { list.unshift({ key: bank.id + '_' + idx, bankId: bank.id, bankLabel: bank.label, q, times: 1, last: Date.now() }); }
  saveWrong(list.slice(0, 500));
}
function removeWrong(key) { saveWrong(getWrong().filter(w => w.key !== key)); }
function wrongCount() { return getWrong().length; }

/* ---------- 首页统计 ---------- */
function getHistory() {
  try { return JSON.parse(localStorage.getItem('zy_history') || '[]'); } catch (e) { return []; }
}
function recordHistory(bank, total, correct, rate) {
  const h = getHistory();
  h.unshift({ bank: bank.label, total, correct, rate, t: Date.now() });
  localStorage.setItem('zy_history', JSON.stringify(h.slice(0, 300)));
}
function homeStats() {
  const h = getHistory();
  const done = h.reduce((s, x) => s + x.total, 0);
  const totalQ = h.reduce((s, x) => s + x.total, 0);
  const totalC = h.reduce((s, x) => s + x.correct, 0);
  const rate = totalQ ? Math.round(totalC / totalQ * 100) : 0;
  $('stDone').textContent = done;
  $('stRate').textContent = rate + '%';
}

/* ============================================================
   首页渲染
   ============================================================ */
function goHome() {
  showPage('home');
  $('navHome').style.display = 'none';
  $('navWrong').style.display = '';
  homeStats();
  renderSubjects();
}
function renderSubjects() {
  const banks = (window.BUILTIN_BANKS || []).filter(b => b.total > 0 && b.questions && b.questions.length);
  const box = $('subjectList');
  box.innerHTML = '';
  $('emptyTip').classList.toggle('hidden', banks.length > 0);
  if (!banks.length) return;

  const groups = {};
  for (const b of banks) { (groups[b.subject] = groups[b.subject] || []).push(b); }
  for (const subj of SUBJECT_ORDER) {
    if (!groups[subj]) continue;
    const color = SUBJECT_COLORS[subj] || '#2563eb';
    const sec = document.createElement('div');
    sec.className = 'subject-block';
    sec.innerHTML = `<div class="subject-title"><span class="dot" style="background:${color}"></span>${esc(subj)}</div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[subj].forEach(b => {
      const card = document.createElement('div');
      card.className = 'bank-card card';
      card.innerHTML = `
        <div class="bc-top"><span class="bc-name">${esc(b.label)}</span><span class="bc-total">${b.total} 题</span></div>
        <div class="bc-meta"><span>${b.total >= 100 ? '完整卷' : b.total >= 60 ? '真题卷' : '精简卷'}</span></div>
        <div class="bc-foot">
          <button class="btn btn-pri" onclick="selectBank('${esc(b.id)}','full')">整卷练习</button>
          <button class="btn btn-ghost" onclick="selectBank('${esc(b.id)}','random')">随机抽题</button>
        </div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    box.appendChild(sec);
  }
}

function selectBank(id, mode) {
  const b = (window.BUILTIN_BANKS || []).find(x => x.id === id);
  if (!b) return;
  S.bank = b;
  S.range = mode;
  $('sumBank').innerHTML = `<span>${esc(b.label)}</span><span style="font-weight:700">${b.total} 题</span>`;
  setRange(mode);
  showPage('setup');
  // 未登录，直接进设置
}

/* ============================================================
   设置页
   ============================================================ */
function setRange(r) {
  S.range = r;
  document.querySelectorAll('#segRange button').forEach(b => b.classList.toggle('on', b.dataset.range === r));
  $('rowCount').classList.toggle('hidden', r !== 'random');
}
function toggleSwitch(el) {
  el.classList.toggle('on');
}
function swVal(el) { return el.classList.contains('on'); }

/* ============================================================
   考试开始
   ============================================================ */
function buildQuestions() {
  const b = S.bank;
  let qs;
  if (S.range === 'random') {
    const n = Math.min(parseInt($('setCount').value) || 60, b.questions.length);
    qs = shuffle(b.questions).slice(0, n);
  } else {
    qs = [...b.questions];
  }
  if (S.shuffle) qs = shuffle(qs);
  // 乱序选项
  if (S.shuffleOpt) {
    qs = qs.map(q => {
      if (q.type === 'B' || q.type === 'C') {
        // 组题选项不宜打乱，保持原样
        return q;
      }
      const correct = q.answer;
      const labels = 'ABCDE';
      const idx = q.options.map((_, i) => i);
      const sidx = shuffle(idx);
      const newOpts = sidx.map(i => q.options[i]);
      let newAns = sidx.map((orig, ni) => (correct.includes(labels[orig]) ? labels[ni] : '')).filter(Boolean).sort().join('');
      return { ...q, options: newOpts, answer: newAns };
    });
  }
  // 预填充同组 groupStem
  const lastGroup = {};
  for (const q of qs) {
    if (q.groupStem) { if (q.groupId) lastGroup[q.groupId] = q.groupStem; }
    else if (q.groupId && lastGroup[q.groupId]) q.groupStem = lastGroup[q.groupId];
  }
  return qs;
}

function startExam() {
  if (!S.bank) return;
  S.qs = buildQuestions();
  S.ans = {};
  S.flags = new Set();
  S.cur = 0;
  S.pass = parseInt($('setPass').value) || 60;
  S.shuffle = swVal($('swShuffle'));
  S.shuffleOpt = swVal($('swShuffleOpt'));
  S.showExp = swVal($('swShowExp'));
  S.timeLeft = (parseInt($('setTime').value) || 90) * 60;

  $('exSubj').textContent = S.bank.subject;
  $('exLabel').textContent = S.bank.label + ' · ' + S.qs.length + ' 题';
  showPage('exam');
  renderNav();
  renderQ(0);
  startTimer();
}

function startTimer() {
  renderTimer();
  clearInterval(S.timer);
  S.timer = setInterval(() => {
    S.timeLeft--;
    renderTimer();
    if (S.timeLeft <= 0) { clearInterval(S.timer); alert('⏰ 考试时间到，系统已自动交卷！'); doSubmit(true); }
  }, 1000);
}
function renderTimer() {
  const el = $('timer');
  const t = Math.max(0, S.timeLeft);
  const m = String(Math.floor(t / 60)).padStart(2, '0');
  const s = String(t % 60).padStart(2, '0');
  el.textContent = m + ':' + s;
  el.classList.toggle('warn', S.timeLeft <= 300);
}

/* ============================================================
   作答
   ============================================================ */
function pick(i, letter) {
  const q = S.qs[i];
  const cur = S.ans[i] || '';
  let next;
  if (q.type === 'X') {
    const set = new Set(cur);
    set.has(letter) ? set.delete(letter) : set.add(letter);
    next = [...set].sort().join('');
  } else {
    next = cur === letter ? '' : letter;
  }
  S.ans[i] = next;
  renderQ(i);
  renderNav();
}
function toggleFlag(i) {
  S.flags.has(i) ? S.flags.delete(i) : S.flags.add(i);
  renderQ(i);
  renderNav();
}
function goPrev() { if (S.cur > 0) renderQ(S.cur - 1); }
function goNext() { if (S.cur < S.qs.length - 1) renderQ(S.cur + 1); else confirmSubmit(); }

/* ---------- 题目渲染 ---------- */
function renderQ(i) {
  S.cur = i;
  const q = S.qs[i];
  const area = $('qArea');
  const correct = q.answer || '';
  const userAns = S.ans[i] || '';

  let optHtml = q.options.map((opt, oi) => {
    const letter = 'ABCDE'[oi];
    const sel = userAns.includes(letter);
    return `<div class="opt ${sel ? 'sel' : ''}" data-type="${q.type}" onclick="pick(${i},'${letter}')">
      <span class="ol">${letter}</span><span class="ot">${esc(stripOpt(opt))}</span></div>`;
  }).join('');

  let groupHtml = '';
  if (q.groupStem) {
    const tag = q.type === 'B' ? '共用备选答案' : q.type === 'C' ? '共用病例' : '共用题干';
    groupHtml = `<div class="group-box"><span class="gb-tag">${tag}</span>${esc(q.groupStem)}</div>`;
  }

  area.innerHTML = `
    <div class="qcard">
      <div class="q-meta">
        <span class="type-badge tb-${q.type}">${q.type}型</span>
        <span class="q-num">第 ${i + 1} 题 / 共 ${S.qs.length} 题</span>
        <span class="q-pos">${TYPE_NAMES[q.type] || q.type}</span>
      </div>
      ${groupHtml}
      <div class="stem">${esc(q.stem)}</div>
      <div class="opts">${optHtml}</div>
      <div class="q-foot">
        <button class="btn btn-line" onclick="toggleFlag(${i})">${q.type === 'X' ? '多选题' : ''} ${i + 1}</button>
        <button class="btn flag-btn ${S.flags.has(i) ? 'on' : ''}" onclick="toggleFlag(${i})">${S.flags.has(i) ? '★ 已标记' : '☆ 标记'}</button>
      </div>
    </div>`;
  // 更新导航高亮
  document.querySelectorAll('#navGrid button').forEach((b, k) => b.classList.toggle('cur', k === i));
}

/* ---------- 答题卡 ---------- */
function renderNav() {
  const grid = $('navGrid');
  grid.innerHTML = S.qs.map((_, i) =>
    `<button class="${S.ans[i] ? 'done' : ''} ${S.flags.has(i) ? 'flag' : ''}" onclick="renderQ(${i})">${i + 1}</button>`
  ).join('');
  $('stDoneN').textContent = Object.keys(S.ans).filter(k => S.ans[k]).length;
  $('stNoneN').textContent = S.qs.length - Object.keys(S.ans).filter(k => S.ans[k]).length;
  $('stFlagN').textContent = S.flags.size;
}

/* ============================================================
   交卷 / 评分
   ============================================================ */
function confirmSubmit() {
  const done = Object.keys(S.ans).filter(k => S.ans[k]).length;
  $('dlgStats').innerHTML = `总题数：<b>${S.qs.length}</b><br>已作答：<b style="color:var(--green)">${done}</b><br>未作答：<b style="color:var(--amber)">${S.qs.length - done}</b><br>已标记：<b style="color:var(--purple)">${S.flags.size}</b>`;
  $('dlgMask').classList.remove('hidden');
}
function closeDlg() { $('dlgMask').classList.add('hidden'); }

// 每题得分：A/B/C 单选 1分；X 多选 全对1分、少选无错选0.5分、错选0分
function qScore(q, userAns) {
  if (!userAns) return 0;
  const u = userAns.toUpperCase();
  const c = q.answer.toUpperCase();
  if (q.type !== 'X') return u === c ? 1 : 0;
  if (u === c) return 1;
  for (const ch of u) if (!c.includes(ch)) return 0;
  return 0.5;
}

function doSubmit(auto) {
  clearInterval(S.timer);
  closeDlg();
  let score = 0;
  const details = S.qs.map((q, i) => {
    const u = S.ans[i] || '';
    const sc = qScore(q, u);
    score += sc;
    return { q, i, u, sc, status: !u ? 'none' : (sc >= 1 ? 'right' : 'wrong') };
  });
  const total = S.qs.length;
  const correctN = details.filter(d => d.status === 'right').length;
  const wrongN = details.filter(d => d.status === 'wrong').length;
  const noneN = details.filter(d => d.status === 'none').length;
  const rate = total ? Math.round(correctN / total * 100) : 0;
  const pass = score >= S.pass;
  S.result = { details, score, total, correctN, wrongN, noneN, rate, pass };

  // 收录错题（仅限作答且答错的题）
  details.forEach(d => { if (d.status === 'wrong') recordWrong(S.bank, d.i, d.q); });

  recordHistory(S.bank, total, correctN, rate);
  renderResult(auto);
  showPage('result');
}

function renderResult(auto) {
  const r = S.result;
  const pct = r.total ? Math.round(r.score / r.total * 100) : 0;
  const ring = $('ring');
  ring.style.setProperty('--p', pct);
  $('resScore').textContent = r.score.toFixed(r.score % 1 ? 1 : 0);
  $('resMax').textContent = '/ ' + r.total + ' 题';
  $('resVerdict').textContent = r.pass ? '🎉 恭喜通过！' : '😥 未达及格线，继续加油！';
  $('resVerdict').className = 'verdict ' + (r.pass ? 'pass' : 'fail');
  $('resMeta').textContent = `及格线 ${S.pass} 分 · 实际得分 ${r.score.toFixed(1)} 分 · 折算 ${pct}%${r.noneN ? ' · 未作答 ' + r.noneN + ' 题' : ''}`;
  $('rsTotal').textContent = r.total;
  $('rsCorrect').textContent = r.correctN;
  $('rsWrong').textContent = r.wrongN;
  $('rsRate').textContent = r.rate + '%';
  setReviewFilter('all');
}

function setReviewFilter(f, btn) {
  S.reviewFilter = f;
  document.querySelectorAll('.filter-btns button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  renderReview();
}
function renderReview() {
  const r = S.result;
  const box = $('reviewList');
  const list = r.details.filter(d => {
    if (S.reviewFilter === 'wrong') return d.status === 'wrong';
    if (S.reviewFilter === 'right') return d.status === 'right';
    return true;
  });
  box.innerHTML = list.map((d, k) => {
    const q = d.q;
    const correct = q.answer;
    const isRight = d.sc >= 1;
    const show = S.showExp;
    let groupHtml = q.groupStem ? `<div class="group-box"><span class="gb-tag">${q.type === 'B' ? '共用备选答案' : '共用病例'}</span>${esc(q.groupStem)}</div>` : '';
    const optHtml = q.options.map((o, oi) => {
      const letter = 'ABCDE'[oi];
      const isC = correct.includes(letter);
      const isU = d.u.includes(letter);
      let mark = '';
      if (isC && isU) mark = '✅';
      else if (isC) mark = '✔（漏选）';
      else if (isU) mark = '❌';
      return `<div class="opt" style="cursor:default">${mark ? '<span class="ol" style="background:' + (isC ? 'var(--green)' : 'var(--red)') + ';color:#fff">' + letter + '</span>' : '<span class="ol">' + letter + '</span>'}<span class="ot">${esc(stripOpt(o))} ${mark}</span></div>`;
    }).join('');
    const ansText = `<div class="ex-ans ${isRight ? 'right' : 'wrong'}">正确答案：${correct}${d.u ? '　你的答案：' + d.u : '　你的答案：（未作答）'}　${d.status === 'none' ? '未作答，得 0 分' : (isRight ? '✓ 得 ' + d.sc + ' 分' : '✗ 得 ' + d.sc + ' 分')}</div>`;
    return `<div class="qcard">
      <div class="q-meta">
        <span class="type-badge tb-${q.type}">${q.type}型</span>
        <span class="q-num">${r.details.indexOf(d) + 1} 题</span>
        ${d.status === 'wrong' ? '<span class="badge" style="background:#fee2e2;color:var(--red)">答错 · 已入错题本</span>' : d.status === 'right' ? '<span class="badge" style="background:#dcfce7;color:var(--green)">答对</span>' : '<span class="badge" style="background:#f1f5f9;color:var(--sub)">未作答</span>'}
      </div>
      ${groupHtml}
      <div class="stem">${esc(q.stem)}</div>
      <div class="opts">${optHtml}</div>
      <div class="explain">${ansText}${q.explanation ? '<div style="margin-top:4px">解析：' + esc(q.explanation) + '</div>' : ''}</div>
    </div>`;
  }).join('') || '<div class="empty-tip">暂无题目</div>';
}

function retry() { selectBank(S.bank.id, S.range); }

/* ============================================================
   错题本
   ============================================================ */
function goWrongbook() {
  showPage('wrong');
  renderWrong();
}
function renderWrong() {
  const list = getWrong();
  $('wrongCount').textContent = list.length ? '(' + list.length + ')' : '';
  const box = $('wrongList');
  $('wrongEmpty').classList.toggle('hidden', list.length > 0);
  box.innerHTML = list.map(w => {
    const q = w.q;
    return `<div class="wrong-item card">
      <div class="wi-top">
        <span class="type-badge tb-${q.type}">${q.type}型</span>
        <span class="badge">${esc(w.bankLabel)}</span>
        <span class="badge">错了 ${w.times} 次</span>
        <span class="badge">${new Date(w.last).toLocaleDateString()}</span>
      </div>
      <div class="wi-stem">${esc(q.stem)}</div>
      <div class="wi-meta">
        <span>正确答案：<b style="color:var(--green)">${q.answer}</b></span>
        ${q.explanation ? '<span>附解析</span>' : ''}
      </div>
      <div class="wi-actions">
        <button class="btn btn-ghost" style="font-size:13px;padding:7px 12px" onclick="reviewWrong('${w.key}')">查看详情</button>
        <button class="btn btn-line" style="font-size:13px;padding:7px 12px" onclick="removeWrong('${w.key}');renderWrong()">移除</button>
      </div>
    </div>`;
  }).join('');
}
function reviewWrong(key) {
  const w = getWrong().find(x => x.key === key);
  if (!w) return;
  const q = w.q;
  alert('【' + w.bankLabel + '】\n\n' + q.stem + '\n\n正确答案：' + q.answer + '\n' + (q.explanation ? '解析：' + q.explanation : ''));
}
function clearWrongbook() {
  if (confirm('确定清空全部错题？')) { saveWrong([]); renderWrong(); }
}

/* ============================================================
   页面切换
   ============================================================ */
function showPage(name) {
  ['home', 'setup', 'exam', 'result', 'wrong'].forEach(p => $('page-' + p).classList.add('hidden'));
  $('page-' + name).classList.remove('hidden');
  if (name === 'home') { $('navHome').style.display = 'none'; $('navWrong').style.display = ''; }
  else { $('navHome').style.display = ''; $('navWrong').style.display = 'none'; }
  window.scrollTo(0, 0);
}

/* ============================================================
   初始化
   ============================================================ */
(function init() {
  $('wrongCount').textContent = wrongCount() ? '(' + wrongCount() + ')' : '';
  goHome();
})();
</script>
